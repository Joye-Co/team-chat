<!doctype html>
<html lang="zh-Hans" data-theme="light">
<head><meta charset="utf-8"><title>精密工具 · 快速切换</title>
<!--@css-->
</head>
<body class="top">
<!--@icons-->
<!--@include glyphs-->
<!--@include main-->
<div class="scrim"></div>
<div class="palette">
  <div class="q"><svg class="i s18"><use href="#i-search"/></svg><span style="flex:1">同步<span class="caret" style="height:20px;vertical-align:-4px"></span></span><span class="scope">全部</span></div>
  <div class="res">
    <div class="gh">话题<span class="sp"></span><span class="num">4</span></div>
    <div class="it on"><svg class="sg progress"><use href="#st-progress"/></svg><span class="t">消息<em>同步</em>：睡眠后丢失</span><span class="ctx"># 开发</span><span class="sp"></span><span class="chip sm progress"><svg class="sg"><use href="#st-progress"/></svg><span>进行中</span></span><span class="kbd">↵</span></div>
    <div class="it"><svg class="sg review"><use href="#st-review"/></svg><span class="t">已读位置跨设备<em>同步</em></span><span class="ctx"># 开发</span><span class="sp"></span><span class="chip sm review"><svg class="sg"><use href="#st-review"/></svg><span>等陈默审</span></span></div>
    <div class="it"><svg class="sg done"><use href="#st-done"/></svg><span class="t">菜单栏图标<em>同步</em>未读数</span><span class="ctx"># 产品</span><span class="sp"></span><span class="time">周一</span></div>
    <div class="it"><svg class="sg"><use href="#st-open"/></svg><span class="t">日历<em>同步</em>到话题截止时间</span><span class="ctx"># 产品</span><span class="sp"></span><span class="time num">10月21日</span></div>
    <div class="gh">产出</div>
    <div class="it"><svg class="i ic"><use href="#i-file-text"/></svg><span class="t"><em>同步</em>协议说明</span><span class="ctx">页面 · 第 4 版 · 周子航</span><span class="sp"></span><span class="time num">10月30日</span></div>
    <div class="gh">群和成员</div>
    <div class="it"><svg class="i ic"><use href="#i-hash"/></svg><span class="t">运维</span><span class="ctx">“数据<em style="font-style:normal;color:var(--accent-text);font-weight:600">同步</em>告警” 3 条消息</span><span class="sp"></span><span class="kbd">⌘</span><span class="kbd">4</span></div>
    <div class="it"><span class="av s20 bot">同<span class="mark" style="--ring-bg:var(--popover)"><svg class="i"><use href="#i-bot"/></svg></span></span><span class="t"><em>同步</em>巡检</span><span class="ctx">每 5 分钟检查一次消息往返</span></div>
    <div class="gh">操作</div>
    <div class="it"><svg class="i ic"><use href="#i-search"/></svg><span class="t">在所有群的消息里搜索“同步”</span><span class="sp"></span><span class="kbd">⌘</span><span class="kbd">↵</span></div>
  </div>
  <div class="ft"><span><span class="kbd">↑</span><span class="kbd">↓</span>选择</span><span><span class="kbd">↵</span>打开</span><span><span class="kbd">⌘</span><span class="kbd">↵</span>搜索消息</span><span class="sp"></span><span><span class="kbd">esc</span>关闭</span></div>
</div>
</body>
</html>
