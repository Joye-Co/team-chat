<!doctype html>
<html lang="zh-Hans" data-theme="light">
<head><meta charset="utf-8"><title>精密工具 · 登录</title>
<!--@css-->
</head>
<body>
<!--@icons-->
<!--@include appicon-->
<div class="desk"></div>
<div class="fwin" style="left:500px;top:160px;width:440px;height:580px">
  <div class="traffic"><i></i><i class="" style="background:var(--fill-quiet);box-shadow:inset 0 0 0 .5px var(--separator-strong)"></i><i style="background:var(--fill-quiet);box-shadow:inset 0 0 0 .5px var(--separator-strong)"></i></div>
  <div class="login">
    <svg class="appicon" viewBox="0 0 1024 1024"><use href="#app-icon"/></svg>
    <h1>欢迎使用 TeamChat</h1>
    <p class="sub">用管理员发给你的邀请码登录</p>
    <form>
      <div><span class="label">服务器地址</span><div class="input"><svg class="i s14" style="color:var(--text-3)"><use href="#i-globe"/></svg><span>https://chat.example.com</span><span style="flex:1"></span><svg class="i s14" style="color:var(--st-done)"><use href="#i-circle-check"/></svg></div><p class="help">已连接 · 延迟 38 ms</p></div>
      <div><span class="label">邀请码或登录凭证</span>
        <div class="otp"><span class="seg">K7QX</span><span class="dash">–</span><span class="seg focus">M2<span class="caret" style="height:20px"></span><span class="ph">··</span></span><span class="dash">–</span><span class="seg"><span class="ph">····</span></span></div>
        <p class="help">向管理员要一个邀请码，邀请码只能用一次</p>
      </div>
      <span class="btn lg disabled" style="width:100%;height:36px;margin-top:6px">登录<span class="kbd">↵</span></span>
    </form>
    <p class="foot"><svg class="i s12"><use href="#i-key-round"/></svg>登录后凭证保存在 macOS 钥匙串中</p>
  </div>
</div>
</body>
</html>
