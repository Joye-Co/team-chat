<!doctype html>
<html lang="zh-Hans" data-theme="light">
<head><meta charset="utf-8"><title>精密工具 · 应用图标</title>
<style>
/* 精密工具 Precise pro: shared tokens and components for the mockups.
   Every value here has the same name in DIRECTION.md. */

:root {
  /* surfaces */
  --window: #f3f3f4;          /* window base, sidebar sits on it */
  --sidebar: #f3f3f4;
  --content: #ffffff;         /* inset content panel */
  --elevated: #ffffff;        /* cards in the timeline */
  --popover: #ffffff;
  --sunken: #f6f6f7;          /* code, inputs at rest, quote fill */
  --scrim: rgba(17, 17, 20, 0.22);

  /* text */
  --text-1: #18181b;
  --text-2: #55555d;
  --text-3: #8b8b93;
  --text-4: #b3b3ba;
  --text-on-accent: #ffffff;

  /* lines */
  --separator: rgba(0, 0, 0, 0.07);
  --separator-strong: rgba(0, 0, 0, 0.12);

  /* fills (row states) */
  --hover: rgba(0, 0, 0, 0.035);
  --pressed: rgba(0, 0, 0, 0.07);
  --selected: rgba(0, 0, 0, 0.06);
  --fill-quiet: rgba(0, 0, 0, 0.05);

  /* accent: cobalt */
  --accent: #3656e0;
  --accent-hover: #2c4bd0;
  --accent-pressed: #2541b8;
  --accent-text: #2f4fd6;
  --accent-tint: rgba(54, 86, 224, 0.09);
  --accent-tint-strong: rgba(54, 86, 224, 0.16);
  --ring: rgba(54, 86, 224, 0.42);
  --text-selection: rgba(54, 86, 224, 0.22);

  /* topic status */
  --st-open: #9a9aa2;
  --st-progress: #c7860a;
  --st-answer: #3656e0;
  --st-review: #7a55d1;
  --st-blocked: #d93a3a;
  --st-done: #2a9a58;
  --st-progress-text: #9a6500;
  --st-answer-text: #2f4fd6;
  --st-review-text: #6643bd;
  --st-blocked-text: #c02f2f;
  --st-done-text: #20804a;

  /* signals */
  --online: #2fa564;
  --offline-ring: #b3b3ba;
  --danger: #d93a3a;
  --danger-tint: rgba(217, 58, 58, 0.09);
  --warning: #c7860a;
  --bot-mark-bg: #18181b;
  --bot-mark-fg: #ffffff;

  /* code */
  --code-bg: #f6f6f7;
  --code-text: #2b2b31;
  --code-keyword: #b13a6a;
  --code-fn: #2f4fd6;
  --code-type: #8a5a00;
  --code-comment: #8b8b93;
  --code-string: #20804a;

  /* elevation: rings are shadows, not borders */
  --e1: 0 0 0 1px rgba(0, 0, 0, 0.055), 0 1px 2px rgba(0, 0, 0, 0.04), 0 4px 12px -6px rgba(0, 0, 0, 0.05);
  --e2: 0 0 0 1px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.05), 0 2px 6px -2px rgba(0, 0, 0, 0.05);
  --e3: 0 0 0 1px rgba(0, 0, 0, 0.075), 0 2px 6px rgba(0, 0, 0, 0.06), 0 12px 28px -6px rgba(0, 0, 0, 0.16);
  --e4: 0 0 0 1px rgba(0, 0, 0, 0.08), 0 8px 18px -8px rgba(0, 0, 0, 0.14), 0 28px 64px -12px rgba(0, 0, 0, 0.28);
  --window-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.18), 0 22px 70px -10px rgba(0, 0, 0, 0.32), 0 8px 20px -8px rgba(0, 0, 0, 0.2);

  /* avatar hues (initials background / text) */
  --av-1-bg: #e6ecff; --av-1-fg: #2f4fd6;
  --av-2-bg: #fdebd9; --av-2-fg: #a35400;
  --av-3-bg: #dff3e7; --av-3-fg: #1f7a45;
  --av-4-bg: #f2e6fb; --av-4-fg: #7643b8;
  --av-5-bg: #fde4e4; --av-5-fg: #b42f2f;
  --av-6-bg: #ddf1f4; --av-6-fg: #11727f;
  --av-bot-bg: #ececef; --av-bot-fg: #3a3a41;

  /* type */
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Apple Color Emoji", sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, monospace;

  /* radii */
  --r-xs: 4px;
  --r-sm: 6px;
  --r-md: 8px;
  --r-lg: 10px;
  --r-xl: 14px;

  color-scheme: light;
}

[data-theme="dark"] {
  --window: #111113;
  --sidebar: #111113;
  --content: #18181b;
  --elevated: #202024;
  --popover: #232328;
  --sunken: #131315;
  --scrim: rgba(0, 0, 0, 0.42);

  --text-1: #ededef;
  --text-2: #a5a5ad;
  --text-3: #74747c;
  --text-4: #4f4f56;

  --separator: rgba(255, 255, 255, 0.065);
  --separator-strong: rgba(255, 255, 255, 0.11);

  --hover: rgba(255, 255, 255, 0.04);
  --pressed: rgba(255, 255, 255, 0.08);
  --selected: rgba(255, 255, 255, 0.07);
  --fill-quiet: rgba(255, 255, 255, 0.06);

  --accent: #5272ff;
  --accent-hover: #6380ff;
  --accent-pressed: #4562e8;
  --accent-text: #8ea2ff;
  --accent-tint: rgba(82, 114, 255, 0.14);
  --accent-tint-strong: rgba(82, 114, 255, 0.24);
  --ring: rgba(102, 132, 255, 0.55);
  --text-selection: rgba(82, 114, 255, 0.34);

  --st-open: #6e6e76;
  --st-progress: #e0a33a;
  --st-answer: #6f8bff;
  --st-review: #a88bf0;
  --st-blocked: #f06464;
  --st-done: #45c07a;
  --st-progress-text: #e8b45a;
  --st-answer-text: #93a7ff;
  --st-review-text: #b9a1f5;
  --st-blocked-text: #f58080;
  --st-done-text: #5fcb8d;

  --online: #3fbf75;
  --offline-ring: #5a5a62;
  --danger: #f06464;
  --danger-tint: rgba(240, 100, 100, 0.13);
  --warning: #e0a33a;
  --bot-mark-bg: #ededef;
  --bot-mark-fg: #18181b;

  --code-bg: #131315;
  --code-text: #d9d9de;
  --code-keyword: #f08bb4;
  --code-fn: #8ea2ff;
  --code-type: #e8b45a;
  --code-comment: #6e6e76;
  --code-string: #6fd29a;

  --e1: 0 0 0 1px rgba(255, 255, 255, 0.055), 0 1px 2px rgba(0, 0, 0, 0.5), 0 6px 16px -6px rgba(0, 0, 0, 0.5);
  --e2: 0 0 0 1px rgba(255, 255, 255, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.035), 0 1px 3px rgba(0, 0, 0, 0.45);
  --e3: 0 0 0 1px rgba(255, 255, 255, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 14px 32px -6px rgba(0, 0, 0, 0.6);
  --e4: 0 0 0 1px rgba(255, 255, 255, 0.09), inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 30px 70px -10px rgba(0, 0, 0, 0.75);
  --window-shadow: 0 0 0 0.5px rgba(255, 255, 255, 0.14), 0 22px 70px -10px rgba(0, 0, 0, 0.7);

  --av-1-bg: #232c52; --av-1-fg: #9fb1ff;
  --av-2-bg: #3b2a18; --av-2-fg: #f0b878;
  --av-3-bg: #1a3527; --av-3-fg: #79d6a0;
  --av-4-bg: #33244a; --av-4-fg: #c6a8f5;
  --av-5-bg: #3e2222; --av-5-fg: #f59a9a;
  --av-6-bg: #173438; --av-6-fg: #7fd3de;
  --av-bot-bg: #2c2c32; --av-bot-fg: #d5d5da;

  color-scheme: dark;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1440px; height: 900px; overflow: hidden; }
html:has(body.tall), body.tall { height: 1000px; }
body {
  font-family: var(--font);
  font-size: 13px;
  line-height: 18px;
  color: var(--text-1);
  background: var(--window);
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "kern";
}
::selection { background: var(--text-selection); }
.num { font-variant-numeric: tabular-nums; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
svg.i.s14 { width: 14px; height: 14px; }
svg.i.s12 { width: 12px; height: 12px; stroke-width: 2; }
svg.i.s18 { width: 18px; height: 18px; stroke-width: 1.6; }
svg.i.s20 { width: 20px; height: 20px; stroke-width: 1.5; }
.trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

/* ------------------------------------------------------------ window */
.win { position: absolute; inset: 0; display: flex; background: var(--window); }
.traffic { position: absolute; left: 18px; top: 18px; display: flex; gap: 8px; z-index: 5; }
.traffic i { width: 12px; height: 12px; border-radius: 50%; display: block; box-shadow: inset 0 0 0 0.5px rgba(0,0,0,0.12); }
.traffic i:nth-child(1) { background: #ff5f57; }
.traffic i:nth-child(2) { background: #febc2e; }
.traffic i:nth-child(3) { background: #28c840; }
.traffic.off i { background: var(--fill-quiet); box-shadow: inset 0 0 0 0.5px var(--separator-strong); }

/* ------------------------------------------------------------ sidebar */
.sidebar { width: 232px; flex: none; display: flex; flex-direction: column; padding: 52px 10px 10px; background: var(--sidebar); }
.search {
  height: 28px; display: flex; align-items: center; gap: 6px; padding: 0 6px 0 8px; margin: 0 0 12px;
  border-radius: var(--r-sm); background: var(--fill-quiet); color: var(--text-3); font-size: 13px;
}
.kbd {
  display: inline-flex; align-items: center; justify-content: center; gap: 1px; height: 18px; min-width: 18px; padding: 0 4px;
  border-radius: var(--r-xs); font: 500 11px/1 var(--font); color: var(--text-3);
  background: var(--content); box-shadow: 0 0 0 1px var(--separator), 0 1px 0 var(--separator);
  font-variant-numeric: tabular-nums;
}
[data-theme="dark"] .kbd { background: rgba(255,255,255,0.06); box-shadow: 0 0 0 1px var(--separator); }
.kbd.flat { background: transparent; box-shadow: none; padding: 0 2px; min-width: 0; }
.sec { display: flex; align-items: center; height: 26px; padding: 0 8px; margin-top: 10px; color: var(--text-3); font-size: 12px; font-weight: 500; }
.sec .grow { flex: 1; }
.sec .sec-count { font-size: 11px; color: var(--text-3); }
.row {
  height: 28px; display: flex; align-items: center; gap: 8px; padding: 0 6px 0 8px; border-radius: var(--r-sm);
  color: var(--text-2); font-size: 13px; position: relative;
}
.row .label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.row .ic { color: var(--text-3); }
.row.unread { color: var(--text-1); font-weight: 600; }
.row.unread .ic { color: var(--text-2); }
.row.sel { background: var(--selected); color: var(--text-1); }
.row.sel .ic { color: var(--text-1); }
.row.hover { background: var(--hover); }
.row.muted { color: var(--text-3); }
.row .tail { display: flex; align-items: center; gap: 4px; flex: none; }
.todo-row { height: 30px; }
.todo-row .why { font-size: 11px; color: var(--text-3); font-weight: 400; flex: none; }
.side-foot { margin-top: auto; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 6px 0 8px; border-radius: var(--r-sm); }
.side-foot .who { flex: 1; min-width: 0; }
.side-foot .who b { display: block; font-weight: 500; font-size: 13px; }
.side-foot .who small { display: block; font-size: 11px; color: var(--text-3); line-height: 14px; }
.side-foot .ic { color: var(--text-3); }

/* badges */
.badge {
  height: 16px; min-width: 16px; padding: 0 5px; border-radius: 5px; display: inline-flex; align-items: center; justify-content: center;
  font: 600 11px/1 var(--font); font-variant-numeric: tabular-nums; color: var(--text-2); background: var(--fill-quiet);
}
.badge.mention { background: var(--accent); color: var(--text-on-accent); padding: 0 5px 0 4px; }
.badge.dot { min-width: 6px; width: 6px; height: 6px; padding: 0; border-radius: 50%; background: var(--accent); }

/* avatars */
.av {
  --s: 32px; width: var(--s); height: var(--s); flex: none; border-radius: 50%; position: relative;
  display: inline-flex; align-items: center; justify-content: center;
  font-weight: 600; font-size: calc(var(--s) * 0.36); letter-spacing: 0; line-height: 1;
  background: var(--av-1-bg); color: var(--av-1-fg);
}
.av.c2 { background: var(--av-2-bg); color: var(--av-2-fg); }
.av.c3 { background: var(--av-3-bg); color: var(--av-3-fg); }
.av.c4 { background: var(--av-4-bg); color: var(--av-4-fg); }
.av.c5 { background: var(--av-5-bg); color: var(--av-5-fg); }
.av.c6 { background: var(--av-6-bg); color: var(--av-6-fg); }
.av.bot { background: var(--av-bot-bg); color: var(--av-bot-fg); }
.av.bot > svg.i { width: 56%; height: 56%; stroke-width: 1.7; }
.av.s16 { --s: 16px; font-size: 8px; }
.av.s18 { --s: 18px; font-size: 8.5px; }
.av.s20 { --s: 20px; font-size: 9px; }
.av.s24 { --s: 24px; font-size: 10px; }
.av.s28 { --s: 28px; font-size: 11px; }
.av.s36 { --s: 36px; font-size: 13px; }
.av .mark {
  position: absolute; right: -3px; bottom: -3px; width: 14px; height: 14px; border-radius: 4px;
  background: var(--bot-mark-bg); color: var(--bot-mark-fg); display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 0 2px var(--ring-bg, var(--content));
}
.av .mark svg { width: 9px; height: 9px; stroke-width: 2.4; }
.av.s18 .mark, .av.s20 .mark, .av.s16 .mark { width: 10px; height: 10px; right: -3px; bottom: -3px; border-radius: 3px; }
.av.s18 .mark svg, .av.s20 .mark svg, .av.s16 .mark svg { width: 7px; height: 7px; stroke-width: 2.8; }
.av .pres {
  position: absolute; right: -1px; bottom: -1px; width: 8px; height: 8px; border-radius: 50%;
  background: var(--online); box-shadow: 0 0 0 2px var(--ring-bg, var(--sidebar));
}
.av .pres.off { background: var(--ring-bg, var(--sidebar)); box-shadow: 0 0 0 2px var(--ring-bg, var(--sidebar)), inset 0 0 0 1.5px var(--offline-ring); }
.sidebar .av { --ring-bg: var(--sidebar); }
.sidebar .row.sel .av { --ring-bg: var(--sidebar); }

/* status glyph + chip */
.sg { width: 14px; height: 14px; flex: none; display: block; }
.sg.s12 { width: 12px; height: 12px; }
.chip {
  display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px 0 5px; border-radius: var(--r-sm);
  font-size: 12px; line-height: 16px; font-weight: 500; white-space: nowrap; flex: none; max-width: 100%;
}
.chip .sg { width: 12px; height: 12px; }
.chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.chip.progress { color: var(--st-progress-text); background: color-mix(in srgb, var(--st-progress) 12%, transparent); }
.chip.answer { color: var(--st-answer-text); background: color-mix(in srgb, var(--st-answer) 11%, transparent); }
.chip.review { color: var(--st-review-text); background: color-mix(in srgb, var(--st-review) 12%, transparent); }
.chip.blocked { color: var(--st-blocked-text); background: color-mix(in srgb, var(--st-blocked) 11%, transparent); }
.chip.done { color: var(--st-done-text); background: color-mix(in srgb, var(--st-done) 12%, transparent); }
/* waiting on me: solid, the only filled chip */
.chip.me { color: #fff; font-weight: 600; }
.chip.me.answer { background: var(--st-answer); }
.chip.me.review { background: var(--st-review); }
.chip.sm { height: 18px; font-size: 11px; padding: 0 6px 0 4px; gap: 3px; }
.chip.sm .sg { width: 11px; height: 11px; }

/* buttons */
.btn {
  height: 28px; padding: 0 10px; border-radius: var(--r-sm); display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  font: 500 13px/1 var(--font); color: var(--text-1); background: var(--content); box-shadow: var(--e2); white-space: nowrap; flex: none;
}
[data-theme="dark"] .btn { background: rgba(255,255,255,0.07); box-shadow: 0 0 0 1px rgba(255,255,255,0.06), inset 0 1px 0 rgba(255,255,255,0.04); }
.btn.primary { background: var(--accent); color: var(--text-on-accent); box-shadow: 0 0 0 1px var(--accent-pressed), inset 0 1px 0 rgba(255,255,255,0.14), 0 1px 2px rgba(0,0,0,0.12); }
.btn.ghost { background: transparent; box-shadow: none; color: var(--text-2); }
.btn.icon { width: 28px; padding: 0; background: transparent; box-shadow: none; color: var(--text-2); }
.btn.icon.on { background: var(--selected); color: var(--text-1); }
.btn.danger { color: var(--danger); }
.btn.lg { height: 32px; padding: 0 14px; font-size: 13px; border-radius: 7px; }
.btn .kbd { background: rgba(255,255,255,0.18); color: rgba(255,255,255,0.9); box-shadow: none; height: 16px; min-width: 16px; font-size: 10.5px; }
.btn:not(.primary) .kbd { background: var(--fill-quiet); color: var(--text-3); }

/* ------------------------------------------------------------ inset content panel */
.panel {
  flex: 1; min-width: 0; margin: 8px 8px 8px 0; border-radius: 12px; background: var(--content); box-shadow: var(--e1);
  display: flex; overflow: hidden; position: relative;
}
.col-head { height: 52px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 16px; }

/* topic list */
.topics { width: 304px; flex: none; display: flex; flex-direction: column; box-shadow: 1px 0 0 var(--separator); position: relative; z-index: 1; }
.topics .col-head h2 { font-size: 15px; line-height: 20px; font-weight: 600; }
.topics .col-head .meta { font-size: 12px; color: var(--text-3); flex: 1; }
.tfilter { display: flex; gap: 2px; padding: 0 12px 8px 12px; overflow: hidden; -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent); }
.tfilter span { white-space: nowrap; flex: none; height: 24px; padding: 0 8px; border-radius: var(--r-sm); font-size: 12px; font-weight: 500; color: var(--text-3); display: inline-flex; align-items: center; gap: 5px; }
.tfilter span.on { background: var(--selected); color: var(--text-1); }
.tfilter span .n { font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.tlist { padding: 0 6px; display: flex; flex-direction: column; gap: 1px; }
.trow { padding: 9px 10px 10px; border-radius: var(--r-md); display: flex; flex-direction: column; gap: 5px; }
.trow.sel { background: var(--selected); }
.trow .l1 { display: flex; align-items: baseline; gap: 8px; }
.trow .t { flex: 1; font-size: 13px; line-height: 18px; font-weight: 500; color: var(--text-1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.trow.read .t { color: var(--text-2); font-weight: 400; }
.trow .time { font-size: 11px; color: var(--text-3); flex: none; font-variant-numeric: tabular-nums; }
.trow .l2 { display: flex; align-items: center; gap: 6px; min-height: 18px; }
.trow .pv { flex: 1; font-size: 12px; line-height: 16px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.trow .pv b { font-weight: 500; color: var(--text-2); }

/* timeline */
.topic { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
.topic .col-head { padding: 0 10px 0 20px; box-shadow: 0 1px 0 var(--separator); position: relative; z-index: 2; background: var(--content); }
.topic .col-head h1 { font-size: 15px; line-height: 20px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.topic .col-head .sp { flex: 1; }
.stack { display: flex; align-items: center; margin-right: 6px; }
.stack .av { --ring-bg: var(--content); box-shadow: 0 0 0 2px var(--content); }
.stack .av + .av { margin-left: -5px; }
.stack .more { font-size: 11px; color: var(--text-3); margin-left: 6px; font-variant-numeric: tabular-nums; }
.vr { width: 1px; height: 16px; background: var(--separator-strong); margin: 0 4px; }

.tl { flex: 1; overflow: hidden; padding: 4px 0 0; display: flex; flex-direction: column; justify-content: flex-end;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 20px, #000 calc(100% - 16px), transparent 100%); }
.day { display: flex; align-items: center; gap: 10px; padding: 14px 20px 6px; color: var(--text-3); font-size: 11px; font-weight: 500; }
.day::after, .day::before { content: ""; height: 1px; flex: 1; background: var(--separator); }
.newdiv { display: flex; align-items: center; gap: 8px; padding: 10px 20px 6px; color: var(--accent-text); font-size: 11px; font-weight: 600; }
.newdiv::before { content: ""; height: 1px; flex: 1; background: var(--accent); opacity: 0.55; }

.msg { display: flex; gap: 12px; padding: 6px 20px 6px; position: relative; }
.msg .av { margin-top: 1px; --ring-bg: var(--content); }
.msg .body { flex: 1; min-width: 0; }
.msg .who { display: flex; align-items: baseline; gap: 8px; height: 20px; }
.msg .who b { font-size: 13px; font-weight: 600; color: var(--text-1); }
.msg .who .role { font-size: 12px; color: var(--text-3); }
.msg .who time { font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; }
