<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>artifact-window-light</title>
<style>

[data-theme="light"] {

  --group: #ffffff;
  --elevated: #ffffff;
  --toolbar-capsule: rgba(255, 255, 255, 0.86);
  --scrim: rgba(0, 0, 0, 0.18);
  --text-1: rgba(0, 0, 0, 0.85);
  --text-2: rgba(0, 0, 0, 0.55);
  --text-3: rgba(0, 0, 0, 0.46);
  --placeholder: rgba(0, 0, 0, 0.36);
  --sep: rgba(0, 0, 0, 0.09);
  --sep-strong: rgba(0, 0, 0, 0.14);
  --fill-hover: rgba(0, 0, 0, 0.035);
  --fill-selected: rgba(0, 0, 0, 0.065);
  --fill-pressed: rgba(0, 0, 0, 0.10);
  --fill-field: rgba(0, 0, 0, 0.045);
  --sidebar-selected: rgba(0, 0, 0, 0.075);
  --control: #ffffff;
  --control-border: rgba(0, 0, 0, 0.13);
  --control-border-focus: rgba(0, 0, 0, 0.26);
  --fill-active: rgba(0, 122, 255, 0.12);
  --chip-ring: rgba(0, 0, 0, 0.14);
  --accent: #007aff;
  --accent-hover: #0a6fe6;
  --accent-pressed: #0062cc;
  --accent-text: #0066d6;
  --accent-soft: rgba(0, 122, 255, 0.11);
  --on-accent: #ffffff;
  --focus-ring: rgba(0, 122, 255, 0.42);
  --selection: rgba(0, 122, 255, 0.20);
  --mention-bg: rgba(0, 122, 255, 0.10);
  --mention-me-bg: rgba(255, 149, 0, 0.18);
  --mention-me-text: #a35400;
  --st-you-bg: rgba(255, 149, 0, 0.17);
  --st-you: #9c5100;
  --st-quiet: rgba(0, 0, 0, 0.62);
  --st-blocked-bg: rgba(255, 59, 48, 0.11);
  --st-blocked: #c4001a;
  --glyph-progress: #007aff;
  --glyph-wait: #e68600;
  --glyph-done: #1f9d45;
  --badge-bg: rgba(0, 0, 0, 0.065);
  --badge-text: rgba(0, 0, 0, 0.58);
  --badge-mention-bg: #007aff;
  --online: #34c759;
  --bot-mark: #7c7c82;
  --code-bg: #f5f5f7;
  --code-text: rgba(0, 0, 0, 0.85);
  --code-keyword: #9b2393;
  --code-string: #c41a16;
  --code-type: #0b4f79;
  --code-fn: #326d74;
  --code-comment: #5d6c79;
  --code-number: #1c00cf;
  --quote-bar: rgba(0, 0, 0, 0.16);
  --card-border: rgba(0, 0, 0, 0.10);
  --image-border: rgba(0, 0, 0, 0.07);
  --danger: #ff3b30;
  --danger-text: #d70015;
  --success: #34c759;
  --warning: #ff9500;
  --new-divider: #ff3b30;
  --shadow-popover: 0 0 0 0.5px rgba(0,0,0,0.12), 0 4px 12px rgba(0,0,0,0.08), 0 14px 36px rgba(0,0,0,0.12);
  --shadow-dialog: 0 0 0 0.5px rgba(0,0,0,0.14), 0 6px 16px rgba(0,0,0,0.10), 0 24px 64px rgba(0,0,0,0.20);
  --shadow-window: 0 0 0 0.5px rgba(0,0,0,0.20), 0 10px 30px rgba(0,0,0,0.18), 0 32px 80px rgba(0,0,0,0.22);
  --shadow-capsule: 0 0 0 0.5px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.06);
  --shadow-control: 0 0 0 0.5px rgba(0,0,0,0.12), 0 1px 1.5px rgba(0,0,0,0.06);
  color-scheme: light;
}
[data-theme="dark"] {
  --desk-a: #1b2129;
  --desk-b: #2a2420;
  --sidebar: #262628;
  --sidebar-tint: rgba(36, 36, 40, 0.76);
  --content: #1e1e20;
  --panel: #232326;
  --window-bg: #1e1e20;
  --group: #2a2a2d;
  --elevated: #2c2c2f;
  --toolbar-capsule: rgba(58, 58, 62, 0.86);
  --scrim: rgba(0, 0, 0, 0.38);
  --text-1: rgba(255, 255, 255, 0.86);
  --text-2: rgba(235, 235, 245, 0.58);
  --text-3: rgba(235, 235, 245, 0.42);
  --placeholder: rgba(235, 235, 245, 0.36);
  --sep: rgba(255, 255, 255, 0.085);
  --sep-strong: rgba(255, 255, 255, 0.13);
  --fill-hover: rgba(255, 255, 255, 0.045);
  --fill-selected: rgba(255, 255, 255, 0.085);
  --fill-pressed: rgba(255, 255, 255, 0.13);
  --fill-field: rgba(255, 255, 255, 0.07);
  --sidebar-selected: rgba(255, 255, 255, 0.10);
  --control: rgba(255, 255, 255, 0.10);
  --control-border: rgba(255, 255, 255, 0.10);
  --control-border-focus: rgba(255, 255, 255, 0.24);
  --fill-active: rgba(10, 132, 255, 0.26);
  --chip-ring: rgba(255, 255, 255, 0.16);
  --accent: #0a84ff;
  --accent-hover: #2b93ff;
  --accent-pressed: #0070e0;
  --accent-text: #4da3ff;
  --accent-soft: rgba(10, 132, 255, 0.22);
  --on-accent: #ffffff;
  --focus-ring: rgba(10, 132, 255, 0.55);
  --selection: rgba(10, 132, 255, 0.36);
  --mention-bg: rgba(10, 132, 255, 0.20);
  --mention-me-bg: rgba(255, 159, 10, 0.24);
  --mention-me-text: #ffbd5c;
  --st-you-bg: rgba(255, 159, 10, 0.22);
  --st-you: #ffb547;
  --st-quiet: rgba(235, 235, 245, 0.64);
  --st-blocked-bg: rgba(255, 69, 58, 0.20);
  --st-blocked: #ff7a70;
  --glyph-progress: #0a84ff;
  --glyph-wait: #ff9f0a;
  --glyph-done: #30d158;
  --badge-bg: rgba(255, 255, 255, 0.10);
  --badge-text: rgba(235, 235, 245, 0.62);
  --badge-mention-bg: #0a84ff;
  --online: #30d158;
  --bot-mark: #8e8e94;
  --code-bg: #28282b;
  --code-text: rgba(255, 255, 255, 0.86);
  --code-keyword: #ff7ab2;
  --code-string: #ff8170;
  --code-type: #6bdfff;
  --code-fn: #67b7a4;
  --code-comment: #7f8c98;
  --code-number: #d9c97c;
  --quote-bar: rgba(255, 255, 255, 0.20);
  --card-border: rgba(255, 255, 255, 0.10);
  --image-border: rgba(255, 255, 255, 0.08);
  --danger: #ff453a;
  --danger-text: #ff6961;
  --success: #30d158;
  --warning: #ff9f0a;
  --new-divider: #ff453a;
  --shadow-popover: 0 0 0 0.5px rgba(255,255,255,0.10), 0 4px 12px rgba(0,0,0,0.30), 0 14px 36px rgba(0,0,0,0.45);
  --shadow-dialog: 0 0 0 0.5px rgba(255,255,255,0.12), 0 6px 16px rgba(0,0,0,0.35), 0 24px 64px rgba(0,0,0,0.55);
  --shadow-window: 0 0 0 0.5px rgba(255,255,255,0.12), 0 0 0 1px rgba(0,0,0,0.6), 0 10px 30px rgba(0,0,0,0.4), 0 32px 80px rgba(0,0,0,0.5);
  --shadow-capsule: 0 0 0 0.5px rgba(255,255,255,0.08), 0 1px 3px rgba(0,0,0,0.30);
  --shadow-control: 0 0 0 0.5px rgba(255,255,255,0.08), 0 1px 1.5px rgba(0,0,0,0.25);
  color-scheme: dark;
}
[data-theme] { color: var(--text-1); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { overflow: hidden; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
  font-size: 13px; line-height: 18px; color: var(--text-1);
  background: var(--content);
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "kern";
  font-kerning: normal;
}
.num, time, .badge, .count, .kbd { font-variant-numeric: tabular-nums; }
.mono, code, pre { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
.i { flex-shrink: 0; display: block; }
.row { display: flex; align-items: center; }
.col { display: flex; flex-direction: column; }
.grow { flex: 1 1 auto; min-width: 0; }
.ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.t2 { color: var(--text-2); }
.t3 { color: var(--text-3); }

/* Desktop backdrop (stands in for the wallpaper the window blurs) */
.desk {
  position: absolute; inset: 0;
  background:
    radial-gradient(1200px 700px at 15% 10%, var(--desk-a), transparent 70%),
    radial-gradient(1000px 800px at 85% 90%, var(--desk-b), transparent 70%),
    linear-gradient(160deg, var(--desk-a), var(--desk-b));
}

/* Avatars */
.avatar {
  position: relative; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center;
  font-weight: 500; letter-spacing: 0; line-height: 1; user-select: none;
}
.botmark {
  position: absolute; right: calc(var(--s) * -0.22); bottom: calc(var(--s) * -0.22);
  width: var(--s); height: var(--s); border-radius: 50%;
  background: var(--bot-mark); color: #fff; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 0 1.5px var(--ring);
}
.presence {
  position: absolute; right: -1px; bottom: -1px; width: var(--s); height: var(--s); border-radius: 50%;
  background: var(--online); box-shadow: 0 0 0 1.5px var(--ring);
}
.gtile {
  flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; border-radius: 5.5px;
  font-weight: 600; line-height: 1;
}

/* Chips and badges */
.chip {
  display: inline-flex; align-items: center; gap: 3px; height: 18px; padding: 0 6px 0 4px; border-radius: 5px;
  font-size: 11px; line-height: 14px; font-weight: 500; white-space: nowrap; flex-shrink: 0; max-width: 168px;
}
.chip .cg { display: inline-flex; }
.g-progress { color: var(--glyph-progress); } .g-wait { color: var(--glyph-wait); } .g-done { color: var(--glyph-done); } .g-inherit { color: inherit; }
.chip .chip-t { display: inline-flex; min-width: 0; overflow: hidden; }
.chip .chip-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; max-width: 104px; }
.chip.st-you { background: var(--st-you-bg); color: var(--st-you); font-weight: 600; }
.chip.st-quiet { background: transparent; color: var(--st-quiet); box-shadow: inset 0 0 0 0.5px var(--chip-ring); }
.chip.st-blocked { background: var(--st-blocked-bg); color: var(--st-blocked); }
.badge {
  display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 6px;
  border-radius: 9px; background: var(--badge-bg); color: var(--badge-text); font-size: 11px; font-weight: 500; flex-shrink: 0;
}
.badge.mention { background: var(--badge-mention-bg); color: var(--on-accent); font-weight: 600; }
.udot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
.kbd {
  display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 4px;
  border-radius: 4px; font-size: 11px; color: var(--text-2); background: var(--fill-field);
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

/* Window chrome */
.traffic { display: flex; gap: 8px; }
.tl { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 0.5px rgba(0,0,0,0.12); }
.tl.r { background: #ff5f57; } .tl.y { background: #febc2e; } .tl.g { background: #28c840; }
[data-theme="dark"] .tl { box-shadow: inset 0 0 0 0.5px rgba(255,255,255,0.10); }
.window-inactive .tl { background: var(--fill-pressed); }

/* Buttons (gpui-component Button, restyled) */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 28px; padding: 0 12px;
  border-radius: 7px; font-size: 13px; font-weight: 500; white-space: nowrap; border: 0; cursor: default;
  font-family: inherit; color: var(--text-1); background: var(--control); box-shadow: var(--shadow-control);
}
.btn.primary { background: var(--accent); color: var(--on-accent); box-shadow: 0 0 0 0.5px rgba(0,0,0,0.08), 0 1px 1.5px rgba(0,0,0,0.10); }
.btn.primary.disabled { background: var(--fill-pressed); color: var(--text-3); box-shadow: none; }
.btn.danger { color: var(--danger-text); }
.btn.ghost { background: transparent; box-shadow: none; color: var(--text-2); padding: 0 6px; }
.btn.sm { height: 24px; padding: 0 10px; font-size: 12px; border-radius: 6px; }
.btn.lg { height: 34px; padding: 0 16px; font-size: 14px; border-radius: 9px; }
.iconbtn {
  width: 28px; height: 28px; border-radius: 7px; display: inline-flex; align-items: center; justify-content: center;
  color: var(--text-2); flex-shrink: 0;
}
.capsule {
  display: inline-flex; align-items: center; height: 32px; padding: 0 2px; border-radius: 16px;
  background: var(--toolbar-capsule); box-shadow: var(--shadow-capsule);
}
.capsule .iconbtn { width: 32px; height: 28px; border-radius: 14px; }

/* Fields */
.field {
  display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; border-radius: 7px;
  background: var(--fill-field); color: var(--text-3); font-size: 13px;
}
.input {
  display: flex; align-items: center; height: 32px; padding: 0 10px; border-radius: 8px; background: var(--control);
  box-shadow: var(--shadow-control); font-size: 13px; color: var(--text-1);
}
.input.focus { box-shadow: 0 0 0 0.5px var(--accent), 0 0 0 3.5px var(--focus-ring); }
.caret { display: inline-block; width: 1.5px; height: 17px; background: var(--accent); vertical-align: -3px; margin-left: 1px; }

/* Popovers and menus */
.popover {
  position: absolute; background: var(--elevated); border-radius: 10px; box-shadow: var(--shadow-popover);
  padding: 5px;
}
.menu-head { font-size: 11px; font-weight: 600; color: var(--text-3); padding: 6px 8px 4px; }
.menu-item { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 8px; border-radius: 6px; }
.menu-item.active { background: var(--fill-active); }
.menu-foot { display: flex; align-items: center; gap: 12px; height: 28px; padding: 0 8px; margin: 4px -5px -5px; font-size: 11px; color: var(--text-2); box-shadow: inset 0 0.5px 0 var(--sep); }
.menu-foot .row { gap: 4px; }

/* Segmented control (gpui-component TabBar segmented) */
.seg { display: inline-flex; padding: 2px; border-radius: 8px; background: var(--fill-field); gap: 0; }
.seg > span { height: 22px; padding: 0 10px; display: inline-flex; align-items: center; gap: 4px; border-radius: 6px; font-size: 12px; color: var(--text-2); font-weight: 500; }
.seg > span.on { background: var(--control); color: var(--text-1); box-shadow: var(--shadow-control); }
[data-theme="dark"] .seg > span.on { background: rgba(255,255,255,0.16); }


.win { position: absolute; inset: 0; display: flex; overflow: hidden; }

/* Sidebar: window-level vibrancy (NSVisualEffectView behind the whole window) + a tint */
.sidebar { width: 236px; flex-shrink: 0; position: relative; display: flex; flex-direction: column; background: var(--sidebar); }
.sb-top { height: 52px; display: flex; align-items: center; padding: 0 12px 0 20px; flex-shrink: 0; }
.sb-top .iconbtn { margin-left: auto; }
.sb-search { margin: 0 10px 10px; }
.sb-search .kbd { margin-left: auto; background: transparent; color: var(--text-3); padding: 0; }
.sb-scroll { flex: 1; overflow: hidden; padding: 0 10px; }
.sb-row { display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 8px; border-radius: 7px; color: var(--text-1); }
.sb-row .label { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-row.unread .label { font-weight: 600; }
.sb-row.sel { background: var(--sidebar-selected); }
.sb-row.muted .label { color: var(--text-2); }
.sb-todo { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 8px; border-radius: 7px; }
.sb-todo .tg { width: 20px; display: flex; justify-content: center; flex-shrink: 0; }
.sb-todo .tg.wait { color: var(--glyph-wait); } .sb-todo .tg.at { color: var(--accent); }
.sb-todo .tt { display: block; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-todo .tc { display: block; font-size: 11px; line-height: 14px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-todo.sel { background: var(--sidebar-selected); }
.sb-more { font-size: 12px; color: var(--text-2); padding: 2px 8px 0 36px; height: 22px; display: flex; align-items: center; }
.sb-band { margin: 0 10px 8px; height: 28px; border-radius: 7px; background: var(--fill-field); display: flex; align-items: center; gap: 6px; padding: 0 8px; font-size: 12px; color: var(--text-2); }
.sb-head { font-size: 11px; line-height: 14px; font-weight: 600; color: var(--text-3); padding: 14px 8px 6px; display: flex; align-items: center; gap: 6px; }
.sb-head .badge { margin-left: auto; }
.sb-head .iconbtn { width: 20px; height: 20px; margin-left: auto; color: var(--text-3); }
.sb-foot { height: 52px; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 18px; flex-shrink: 0; }
.sb-foot .who { line-height: 16px; }
.sb-foot .who b { font-weight: 500; display: block; }
.sb-foot .who span { font-size: 11px; color: var(--text-2); }
.conn { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-2); }

/* Columns */
.list { width: 300px; flex-shrink: 0; background: var(--content); display: flex; flex-direction: column; box-shadow: inset 0.5px 0 0 var(--sep); }
.view { flex: 1; min-width: 0; background: var(--content); display: flex; flex-direction: column; box-shadow: inset 0.5px 0 0 var(--sep); position: relative; }
.panel { width: 280px; flex-shrink: 0; background: var(--panel); display: flex; flex-direction: column; box-shadow: inset 0.5px 0 0 var(--sep); }
.toolbar { height: 52px; flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 16px; position: relative; z-index: 2; }
.toolbar .title { font-size: 15px; line-height: 20px; font-weight: 600; }
.view .toolbar .title { font-size: 17px; line-height: 22px; }
.capsule .iconbtn.on { background: var(--fill-selected); color: var(--text-1); }
.toolbar .sub { font-size: 11px; line-height: 14px; color: var(--text-2); }
.edge { position: absolute; left: 0; right: 0; top: 52px; height: 14px; background: linear-gradient(var(--content), transparent); z-index: 1; pointer-events: none; }

/* Topic list */
.list-filter { padding: 0 12px 8px; display: flex; align-items: center; gap: 8px; }
.list-filter .seg { flex: 1; } .list-filter .seg > span { flex: 1; justify-content: center; }
.topics { flex: 1; overflow: hidden; padding: 0 8px; }
.topic { position: relative; display: flex; flex-direction: column; gap: 4px; padding: 9px 10px 10px 20px; border-radius: 8px; }
.topic + .topic::before { content: ""; position: absolute; left: 20px; right: 10px; top: 0; height: 0.5px; background: var(--sep); }
.topic.sel::before, .topic.sel + .topic::before { display: none; }
.topic.sel { background: var(--fill-selected); }
.topic .l1 { display: flex; align-items: baseline; gap: 8px; }
.topic .ttl { flex: 1; min-width: 0; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topic.unread .ttl { font-weight: 600; }
.topic time { font-size: 12px; color: var(--text-2); flex-shrink: 0; }
.topic .l2 { display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 16px; color: var(--text-2); }
.topic .l2 .pv { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topic .udot { position: absolute; left: 6px; top: 14px; }
.seg .num { color: var(--text-3); font-weight: 400; }

/* Topic view */
.view .head { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.view .head .row { gap: 8px; min-width: 0; }
.stack { display: flex; }
.stack .avatar { box-shadow: 0 0 0 1.5px var(--content); }
.stack .avatar + .avatar { margin-left: -6px; }
.timeline { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 0 4px; }
.timeline.up { justify-content: flex-start; padding-top: 8px; }
.tstart { display: flex; gap: 12px; align-items: center; padding: 10px 24px 14px 20px; margin-bottom: 4px; }
.tstart .tsi { width: 32px; height: 32px; border-radius: 50%; background: var(--fill-field); color: var(--text-2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.tstart b { font-size: 15px; line-height: 20px; font-weight: 600; }
.tstart .t2 { font-size: 12px; }
.jump { position: absolute; left: 50%; transform: translateX(-50%); bottom: 150px; height: 30px; padding: 0 12px; border-radius: 15px; background: var(--elevated); box-shadow: var(--shadow-popover); display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; z-index: 3; }
.day { align-self: center; font-size: 11px; font-weight: 500; color: var(--text-3); margin: 8px 0 4px; }
.msg { display: flex; gap: 12px; padding: 4px 24px 4px 20px; position: relative; }
.msg + .msg:not(.cont) { margin-top: 12px; }
.msg.cont { padding-top: 2px; }
.msg .gut { width: 32px; flex-shrink: 0; }
.msg .meta { display: flex; align-items: baseline; gap: 6px; margin-bottom: 2px; min-width: 0; }
