name: Install Bun dependencies
description: Pinned Bun with a shared download cache and a frozen workspace install
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      id: bun
      with:
        bun-version: 1.3.10
    # Cache downloads, never node_modules or Wrangler state. Every job still checks the lockfile.
    - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      id: cache
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ runner.arch }}-${{ steps.bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-${{ steps.bun.outputs.bun-version }}-
    - shell: bash
      run: bun install --frozen-lockfile
    # Only trusted main pushes populate the shared cache; PRs (including forks) only restore.
    - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
      with:
        path: ~/.bun/install/cache
        key: ${{ steps.cache.outputs.cache-primary-key }}
