name: Windows installer

# The Windows installer job of CI (ci.yml calls it): a release build, the installer, a silent
# install, the update from this version to the next one against a local server, a rollback,
# and the same with installers signed by a certificate made for this run.
#
# It is a called workflow so that the server URLs reach it as a secret: see the caller.

on:
  workflow_call:
    secrets:
      SERVERS_JSON:
        description: '{ "staging": "<url>", "production": "<url>" }, or empty: the build then carries no server URLs'
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  installer:
    name: Windows installer and update (install, update, roll back, uninstall)
    runs-on: windows-2025
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - name: Mask the server addresses
        # Before anything else: every later log line of this job shows *** for a server URL or
        # host. The value arrives as a secret of this called workflow, so the step's own
        # header shows *** too. The repository is public and so are its logs.
        env:
          TC_SERVERS_JSON: ${{ secrets.SERVERS_JSON }}
        run: |
          printf '%s' "$TC_SERVERS_JSON" | jq -r '.. | strings' 2>/dev/null | tr -d '\r' | while IFS= read -r url; do
            [ -n "$url" ] || continue
            echo "::add-mask::$url"
            host="${url#*://}"
            echo "::add-mask::${host%%[/:]*}"
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows-release
          # The install and update steps can fail while the port is young; keep the build.
          cache-on-failure: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      # wrangler, for the local server of the update test.
      - run: bun install --frozen-lockfile
      - name: Install NSIS
        run: |
          if ! command -v makensis >/dev/null 2>&1 && [ ! -x "/c/Program Files (x86)/NSIS/makensis.exe" ]; then
            choco install nsis -y --no-progress
          fi
      # The installer test draws one screen of the installed app; see desktop-windows.
      - name: Set the screen to 1920x1080
        shell: pwsh
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Make a signing certificate for this run
        # A self-signed code-signing certificate that only this runner trusts. It stands in for
        # the operator's certificate, so the signing step and the same-publisher rule of the
        # update helper run here too. Nothing signed with it leaves the runner.
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=CI Test Publisher" `
            -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddDays(2)
          $file = Join-Path $env:RUNNER_TEMP "ci-test-publisher.cer"
          Export-Certificate -Cert $cert -FilePath $file | Out-Null
          Import-Certificate -FilePath $file -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
          Import-Certificate -FilePath $file -CertStoreLocation Cert:\LocalMachine\TrustedPublisher | Out-Null
          "TEST_SIGN_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
      - name: Build the update helper of the interruption test
        # With the pause switch that the shipped helper does not have; built first, so the
        # installer's build replaces it in the target folder.
        run: |
          cargo build --release --locked -p update-helper --features test-pause
          mkdir -p .tmp/test-helper
          cp "${CARGO_TARGET_DIR:-target}/release/update-helper.exe" .tmp/test-helper/update-helper-pause.exe
          echo "PAUSE_HELPER=$PWD/.tmp/test-helper/update-helper-pause.exe" >>"$GITHUB_ENV"
      - name: Build the installer
        env:
          TC_SERVERS_JSON: ${{ secrets.SERVERS_JSON }}
        run: |
          . scripts/lib.sh
          a="$(workspace_version)"
          IFS=. read -r major minor patch <<<"$a"
          echo "A_VERSION=$a" >>"$GITHUB_ENV"
          echo "B_VERSION=$major.$minor.$((patch + 1))" >>"$GITHUB_ENV"
          echo "APP_NAME=$(product name)" >>"$GITHUB_ENV"
          DIST=dist/unsigned scripts/build-windows-installer.sh
      - name: Pack the same build signed
        run: WINDOWS_SIGN_THUMBPRINT="$TEST_SIGN_THUMBPRINT" DIST=dist/signed scripts/build-windows-installer.sh --skip-build
      - name: Upload the installer
        # Unsigned, as a build without the operator's certificate is: for a look on a real
        # Windows machine. Not a release.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer
          path: dist/unsigned/*
          if-no-files-found: error
          retention-days: 7
      - name: Test the installer (install, check, start, uninstall)
        env:
          TC_SERVERS_JSON: ${{ secrets.SERVERS_JSON }}
        run: scripts/test-windows-installer.sh "dist/unsigned/$APP_NAME-$A_VERSION-setup.exe"
      - name: Test the signed installer
        env:
          TC_SERVERS_JSON: ${{ secrets.SERVERS_JSON }}
        run: EXPECT_SIGNED=1 scripts/test-windows-installer.sh "dist/signed/$APP_NAME-$A_VERSION-setup.exe"
      - name: Build the next version (the update of the test)
        # The version is compiled into the app, so the update is a second build. Only the
        # workspace crates compile again.
        env:
          TC_SERVERS_JSON: ${{ secrets.SERVERS_JSON }}
        run: |
          . scripts/lib.sh
          set_workspace_version "$B_VERSION"
          cargo update --workspace --offline
          DIST=dist/unsigned scripts/build-windows-installer.sh
          WINDOWS_SIGN_THUMBPRINT="$TEST_SIGN_THUMBPRINT" DIST=dist/signed scripts/build-windows-installer.sh --skip-build
      - name: Check the publisher comparison of a release
        # What test-windows-installer.sh --same-as decides in the Release workflow, on the four
        # installers of this run and a program of another publisher.
        run: |
          . scripts/lib.sh
          . scripts/windows/lib.sh
          helper="${CARGO_TARGET_DIR:-target}/release/update-helper.exe"
          a_signed="dist/signed/$APP_NAME-$A_VERSION-setup.exe"
          b_signed="dist/signed/$APP_NAME-$B_VERSION-setup.exe"
          a_plain="dist/unsigned/$APP_NAME-$A_VERSION-setup.exe"
          b_plain="dist/unsigned/$APP_NAME-$B_VERSION-setup.exe"
          other="$(cygpath -u "$SYSTEMROOT")/System32/whoami.exe"
          same_publisher "$helper" "$a_signed" "$b_signed"
          same_publisher "$helper" "$a_plain" "$b_plain"
          same_publisher "$helper" "$a_plain" "$b_signed"
          if same_publisher "$helper" "$a_signed" "$b_plain"; then echo "::error::an unsigned installer passed as the update of a signed app"; exit 1; fi
          if same_publisher "$helper" "$a_signed" "$other"; then echo "::error::another publisher passed as the same"; exit 1; fi
          # A certificate this computer does not trust: only the very same certificate, in
          # the same state. The test certificate leaves the trusted roots for this check.
          cert="Cert:\\LocalMachine\\Root\\$TEST_SIGN_THUMBPRINT"
          ARG1="$cert" ps_out 'Export-Certificate -Cert (Get-Item -LiteralPath $env:ARG1) -FilePath "$env:RUNNER_TEMP\root.cer" | Out-Null; Remove-Item -LiteralPath $env:ARG1 -Force'
          untrusted=0
          same_publisher "$helper" "$a_signed" "$b_signed" || untrusted=$?
          refused=0
          same_publisher "$helper" "$a_signed" "$other" && refused=1
          ps_out 'Import-Certificate -FilePath "$env:RUNNER_TEMP\root.cer" -CertStoreLocation Cert:\LocalMachine\Root | Out-Null'
          [ "$(signature_status "$a_signed")" = Valid ] || { echo "::error::the test certificate is not trusted again"; exit 1; }
          [ "$untrusted" = 0 ] || { echo "::error::an untrusted certificate did not accept its own newer installer"; exit 1; }
          [ "$refused" = 0 ] || { echo "::error::an untrusted certificate accepted another publisher"; exit 1; }
      - name: Test the update (the installed app updates itself, then a rollback)
        run: scripts/test-windows-update.sh "dist/unsigned/$APP_NAME-$A_VERSION-setup.exe" "dist/unsigned/$APP_NAME-$B_VERSION-setup.exe"
      - name: Test the update of a signed app
        run: EXPECT_SIGNED=1 scripts/test-windows-update.sh "dist/signed/$APP_NAME-$A_VERSION-setup.exe" "dist/signed/$APP_NAME-$B_VERSION-setup.exe" 8836
      - name: Upload the test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer-logs
          path: |
            .tmp/windows-installer
            .tmp/windows-update
            !.tmp/windows-update/state
            !.tmp/windows-update/**/*.exe
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove the signing certificate
        if: always()
        shell: pwsh
        run: |
          if ($env:TEST_SIGN_THUMBPRINT) {
            foreach ($store in "Cert:\CurrentUser\My", "Cert:\LocalMachine\Root", "Cert:\LocalMachine\TrustedPublisher") {
              Remove-Item -LiteralPath "$store\$env:TEST_SIGN_THUMBPRINT" -DeleteKey -ErrorAction SilentlyContinue
            }
          }

  log-check:
    name: No server address in the logs
    # The logs of a public repository are public. Reads the log of every finished job of this
    # run and fails when one shows a server host.
    needs: [installer]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the logs of this run
        env:
          GH_TOKEN: ${{ github.token }}
          TC_SERVERS_JSON: ${{ secrets.SERVERS_JSON }}
        run: scripts/check-logs-for-servers.sh
