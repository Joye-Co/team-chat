name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      desktop:
        description: Also build the macOS desktop DMG (macOS minutes cost 10x)
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      packages: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.packages == 'true' }}
      server: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.server == 'true' }}
      rust: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.rust == 'true' }}
      ops: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.ops == 'true' }}
      desktop: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.desktop == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            common: &common
              - .github/workflows/ci.yml
              - scripts/ci-run.sh
              - scripts/lib.sh
              - scripts/servers.ts
            js: &js
              - *common
              - package.json
              - bun.lock
              - product.json
            packages:
              - *js
              - packages/**
              - protocol/**
            server:
              - *js
              - server/**
              - packages/**
            rust: &rust
              - *common
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml
              - product.json
              - crates/**
              - apps/daemon/**
              - protocol/**
            # ops/restore's config test reads server/wrangler.jsonc and ops/monitor/wrangler.jsonc.
            ops:
              - *js
              - ops/**
              - server/wrangler.jsonc
              - server/src/ops/index.ts
              - scripts/deploy-server.sh
              - scripts/release-check.sh
              - scripts/test-release-scripts.sh
              - Cargo.toml
              - CHANGELOG.md
              - docs/releases/**
            desktop:
              - *rust
              - apps/desktop/**
              - assets/**
              - third_party/**

  packages:
    name: Packages (bun)
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: scripts/ci-run.sh typecheck packages/*
      - name: Test
        run: scripts/ci-run.sh test packages/*

  server:
    name: Server (Workers)
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: scripts/ci-run.sh typecheck server
      - name: Test
        run: scripts/ci-run.sh test server

  rust:
    name: Rust (protocol, core, daemon)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux-test
      - name: cargo test
        run: cargo test --locked -p chat-protocol -p chat-core -p daemon

  daemon-e2e:
    name: Daemon local e2e (Linux, fake Claude and Codex)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.server == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux-test
      - name: Build the daemon and the cancel_run client example
        run: cargo build --locked -p daemon && cargo build --locked -p chat-core --example cancel_run
      # wrangler dev with fresh local state, the real daemon on Linux with the fake Claude Code
      # CLI (socket transport) and the fake Codex app-server (file transport).
      - name: Local e2e
        run: bun apps/daemon/e2e/local-e2e.ts --port 8793

  ops:
    name: Ops (monitor, restore)
    needs: changes
    if: needs.changes.outputs.ops == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: scripts/ci-run.sh typecheck ops/*
      - name: Test
        run: scripts/ci-run.sh test ops/*
      - name: Release script guards
        run: scripts/test-release-scripts.sh

  desktop-test:
    name: Desktop tests (macOS)
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: macos-test
      - name: cargo test
        run: cargo test --locked -p desktop

  rust-lint:
    name: Rust fmt and clippy (report only)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Report only until main is clean: fmt and clippy fail on main today. Remove this line then.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux-test
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        if: always()
        run: cargo clippy --locked -p chat-protocol -p chat-core -p daemon --all-targets -- -D warnings

  desktop-macos:
    name: Desktop DMG (macOS)
    # Only on manual runs: a release build of the DMG is slow and costly.
    if: github.event_name == 'workflow_dispatch' && inputs.desktop
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: macos-release
      - name: Build the DMG
        run: scripts/build-dmg.sh
      - name: Check the DMG
        run: scripts/test-dmg.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dmg
          path: dist/*.dmg*
          if-no-files-found: error
          retention-days: 14
