name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      desktop:
        description: Also build the macOS desktop DMG (macOS minutes cost 10x)
        type: boolean
        default: true
      windows_scenes:
        description: Scenes of the Windows screenshot self-test, comma separated (empty = the main screens, all = every scene)
        type: string
        default: ""

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      packages: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.packages == 'true' }}
      server: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.server == 'true' }}
      rust: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.rust == 'true' }}
      ops: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.ops == 'true' }}
      desktop: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.desktop == 'true' }}
      installer: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.installer == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            common: &common
              - .github/workflows/ci.yml
              - scripts/ci-run.sh
              - scripts/lib.sh
              - scripts/servers.ts
            js: &js
              - *common
              - package.json
              - bun.lock
              - product.json
            packages:
              - *js
              - packages/**
              - protocol/**
              - scripts/sandbox/**
            server:
              - *js
              - server/**
              - packages/**
              - scripts/sandbox/**
            rust: &rust
              - *common
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml
              - product.json
              - crates/**
              - apps/daemon/**
              - apps/update-helper/**
              - protocol/**
            # ops/restore's config test reads server/wrangler.jsonc and ops/monitor/wrangler.jsonc.
            ops:
              - *js
              - ops/**
              - server/wrangler.jsonc
              - server/src/ops/index.ts
              - scripts/deploy-server.sh
              - scripts/release-check.sh
              - scripts/test-release-scripts.sh
              - Cargo.toml
              - CHANGELOG.md
              - docs/releases/**
            desktop:
              - *rust
              - apps/desktop/**
              - scripts/windows-screenshots.sh
              - assets/**
              - third_party/**
            # The Windows installer, the update helper and the app's updater: a release build,
            # so only what can change them.
            installer:
              - *common
              - .github/workflows/release.yml
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml
              - product.json
              - scripts/build-windows-installer.sh
              - scripts/test-windows-installer.sh
              - scripts/test-windows-update.sh
              - scripts/windows/**
              - apps/update-helper/**
              - apps/desktop/build.rs
              - apps/desktop/Cargo.toml
              - apps/desktop/src/main.rs
              - apps/desktop/src/updater/**
              - crates/chat-core/src/updates.rs
              - crates/chat-protocol/src/updates.rs
              - server/src/files/**
              - server/migrations/**
              - assets/brand/AppIcon.ico

  packages:
    name: Packages (bun)
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: scripts/ci-run.sh typecheck packages/*
      - name: Test
        run: scripts/ci-run.sh test packages/*

  server:
    name: Server (Workers)
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: scripts/ci-run.sh typecheck server
      - name: Test
        run: scripts/ci-run.sh test server
      # The local sandbox (bun run dev:desktop): wrangler dev, every migration and the sample team
      # through the public API. A wire change that breaks the samples fails here.
      - name: Sandbox seed
        run: bun scripts/sandbox/up.ts --reset && bun scripts/sandbox/up.ts --stop
      - name: Sandbox server log
        if: failure()
        run: tail -n 200 .tmp/sandbox/server.log || true

  rust:
    name: Rust (protocol, core, daemon)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux-test
      - name: cargo test
        run: cargo test --locked -p chat-protocol -p chat-core -p daemon -p update-helper

  daemon-e2e:
    name: Daemon local e2e (Linux, fake Claude and Codex)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.server == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux-test
      - name: Build the daemon and the cancel_run client example
        run: cargo build --locked -p daemon && cargo build --locked -p chat-core --example cancel_run
      # wrangler dev with fresh local state, the real daemon on Linux with the fake Claude Code
      # CLI (socket transport) and the fake Codex app-server (file transport).
      - name: Local e2e
        run: bun apps/daemon/e2e/local-e2e.ts --port 8793

  ops:
    name: Ops (monitor, restore)
    needs: changes
    if: needs.changes.outputs.ops == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: scripts/ci-run.sh typecheck ops/*
      - name: Test
        run: scripts/ci-run.sh test ops/*
      - name: Release script guards
        run: scripts/test-release-scripts.sh

  desktop-test:
    name: Desktop tests (macOS)
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: macos-test
      - name: cargo test
        run: cargo test --locked -p desktop

  desktop-windows:
    name: Desktop build and tests (Windows)
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows-test
          # The screenshot step can fail while the port is young; keep the build for the next run.
          cache-on-failure: true
      - name: cargo build
        run: cargo build --locked -p desktop
      # How to use the screenshots: docs/plans/windows.zh.md, 「怎么看 Windows 界面」.
      # The runner's screen is 1024x768 and Windows keeps a window inside the screen.
      - name: Set the screen to 1920x1080
        shell: pwsh
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Screenshot self-test (light and dark)
        env:
          SCENES: ${{ inputs.windows_scenes }}
          RUST_BACKTRACE: "1"
        run: scripts/windows-screenshots.sh "$RUNNER_TEMP/windows-screenshots"
      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-screenshots
          path: ${{ runner.temp }}/windows-screenshots
          if-no-files-found: warn
          retention-days: 14
      - name: cargo test (protocol and core)
        run: cargo test --locked -p chat-protocol -p chat-core
      # Required, every desktop test (this replaces the Windows system integration subset and
      # the report-only full run). The skipped test fails on Windows and belongs to work in
      # progress; whoever lands that work removes its line here (docs/plans/windows.zh.md):
      # - provider::this_mac (one test): the launchd PATH builder joins with `\` on Windows (M3).
      - name: cargo test (desktop)
        run: >-
          cargo test --locked -p desktop --
          --skip provider::this_mac::tests::the_service_path_keeps_the_shell_path_first_and_adds_usual_folders
      # An embedded 产出 page (WebView2 child window) in a real GPUI window: with GPUI presenting
      # to the HWND, as the app runs, the page must show. The DirectComposition run is the
      # record of why the app turns it off (the page stays under GPUI's content).
      - name: Embedded page in a GPUI window (screenshots)
        run: |
          cargo build --locked -p desktop --example win_embed_gpui
          GPUI_DISABLE_DIRECT_COMPOSITION=1 cargo run --locked -p desktop --example win_embed_gpui -- "$RUNNER_TEMP/embed-gpui/hwnd-swap-chain"
          cargo run --locked -p desktop --example win_embed_gpui -- "$RUNNER_TEMP/embed-gpui/direct-composition" \
            || echo "::notice::with DirectComposition the child window is covered, as expected"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-embed-gpui
          path: ${{ runner.temp }}/embed-gpui
          if-no-files-found: warn
          retention-days: 14

  # The WebView2 backend of crates/artifact-view runs only here: nobody develops on Windows.
  artifact-view-windows:
    name: Artifact view (Windows, WebView2)
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows-artifact-view
      - name: cargo build (tests and examples)
        run: cargo build --locked -p artifact-view --tests --examples
      # Unit tests, then tests/isolation.rs in a real WebView2 (the same assertions as WKWebView).
      - name: cargo test (isolation in WebView2)
        env:
          ARTIFACT_VIEW_ISOLATION_REPORT: ${{ runner.temp }}/artifact-view/isolation.json
        run: cargo test --locked -p artifact-view --no-fail-fast
      - name: Embedded view in a host window (screenshots)
        if: always()
        run: cargo run --locked -p artifact-view --example win_embed_proto -- "$RUNNER_TEMP/artifact-view/embed"
      - name: Diagram renderer (PNG per sample)
        if: always()
        run: cargo run --locked -p artifact-view --example diagram_selftest -- "$RUNNER_TEMP/artifact-view/diagrams"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: artifact-view-windows
          path: ${{ runner.temp }}/artifact-view
          if-no-files-found: warn
          retention-days: 14

  daemon-windows:
    name: Daemon tests (Windows)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows-daemon
      # The unit tests, the chat-run client and tests/process_tree.rs: one run of a fake CLI in
      # a Job Object, with cancel and pause (docs/plans/windows.zh.md, M1). The suites that
      # need the Python fake CLIs and /bin/sh are Unix only.
      - name: cargo test (daemon)
        run: cargo test --locked -p daemon --no-fail-fast
      - name: cargo check (e2e tool)
        run: cargo check --locked -p e2e --all-targets

  # The Windows release from end to end (docs/plans/windows.zh.md, R1): a release build of the
  # app, the update helper and the daemon, the NSIS installer, a silent install with its files,
  # registry entries and shortcut, the installed app's start, the uninstall; then the app's own
  # update from this version to the next one against a local server, a rollback, and the same
  # with installers signed by a certificate made for this run.
  windows-installer:
    name: Windows installer and update (install, update, roll back, uninstall)
    needs: changes
    if: needs.changes.outputs.installer == 'true'
    runs-on: windows-2025
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows-release
          # The install and update steps can fail while the port is young; keep the build.
          cache-on-failure: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      # wrangler, for the local server of the update test.
      - run: bun install --frozen-lockfile
      - name: Install NSIS
        run: |
          if ! command -v makensis >/dev/null 2>&1 && [ ! -x "/c/Program Files (x86)/NSIS/makensis.exe" ]; then
            choco install nsis -y --no-progress
          fi
      # The installer test draws one screen of the installed app; see desktop-windows.
      - name: Set the screen to 1920x1080
        shell: pwsh
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Make a signing certificate for this run
        # A self-signed code-signing certificate that only this runner trusts. It stands in for
        # the operator's certificate, so the signing step and the same-publisher rule of the
        # update helper run here too. Nothing signed with it leaves the runner.
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=CI Test Publisher" `
            -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddDays(2)
          $file = Join-Path $env:RUNNER_TEMP "ci-test-publisher.cer"
          Export-Certificate -Cert $cert -FilePath $file | Out-Null
          Import-Certificate -FilePath $file -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
          Import-Certificate -FilePath $file -CertStoreLocation Cert:\LocalMachine\TrustedPublisher | Out-Null
          "TEST_SIGN_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
      - name: Build the installer
        run: |
          . scripts/lib.sh
          a="$(workspace_version)"
          IFS=. read -r major minor patch <<<"$a"
          echo "A_VERSION=$a" >>"$GITHUB_ENV"
          echo "B_VERSION=$major.$minor.$((patch + 1))" >>"$GITHUB_ENV"
          echo "APP_NAME=$(product name)" >>"$GITHUB_ENV"
          DIST=dist/unsigned scripts/build-windows-installer.sh
      - name: Pack the same build signed
        run: WINDOWS_SIGN_THUMBPRINT="$TEST_SIGN_THUMBPRINT" DIST=dist/signed scripts/build-windows-installer.sh --skip-build
      - name: Upload the installer
        # Unsigned, as a build without the operator's certificate is: for a look on a real
        # Windows machine. Not a release.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer
          path: dist/unsigned/*
          if-no-files-found: error
          retention-days: 7
      - name: Test the installer (install, check, start, uninstall)
        run: scripts/test-windows-installer.sh "dist/unsigned/$APP_NAME-$A_VERSION-setup.exe"
      - name: Test the signed installer
        run: EXPECT_SIGNED=1 scripts/test-windows-installer.sh "dist/signed/$APP_NAME-$A_VERSION-setup.exe"
      - name: Build the next version (the update of the test)
        # The version is compiled into the app, so the update is a second build. Only the
        # workspace crates compile again.
        run: |
          . scripts/lib.sh
          set_workspace_version "$B_VERSION"
          cargo update --workspace --offline
          DIST=dist/unsigned scripts/build-windows-installer.sh
          WINDOWS_SIGN_THUMBPRINT="$TEST_SIGN_THUMBPRINT" DIST=dist/signed scripts/build-windows-installer.sh --skip-build
      - name: Test the update (the installed app updates itself, then a rollback)
        run: scripts/test-windows-update.sh "dist/unsigned/$APP_NAME-$A_VERSION-setup.exe" "dist/unsigned/$APP_NAME-$B_VERSION-setup.exe"
      - name: Test the update of a signed app
        run: EXPECT_SIGNED=1 scripts/test-windows-update.sh "dist/signed/$APP_NAME-$A_VERSION-setup.exe" "dist/signed/$APP_NAME-$B_VERSION-setup.exe" 8836
      - name: Upload the test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer-logs
          path: |
            .tmp/windows-installer
            .tmp/windows-update
            !.tmp/windows-update/state
            !.tmp/windows-update/**/*.exe
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove the signing certificate
        if: always()
        shell: pwsh
        run: |
          if ($env:TEST_SIGN_THUMBPRINT) {
            foreach ($store in "Cert:\CurrentUser\My", "Cert:\LocalMachine\Root", "Cert:\LocalMachine\TrustedPublisher") {
              Remove-Item -LiteralPath "$store\$env:TEST_SIGN_THUMBPRINT" -DeleteKey -ErrorAction SilentlyContinue
            }
          }

  rust-lint:
    name: Rust fmt and clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux-test
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        if: always()
        run: cargo clippy --locked -p chat-protocol -p chat-core -p daemon -p update-helper --all-targets -- -D warnings

  desktop-macos:
    name: Desktop DMG (macOS)
    # Only on manual runs: a release build of the DMG is slow and costly.
    if: github.event_name == 'workflow_dispatch' && inputs.desktop
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: macos-release
      - name: Build the DMG
        run: scripts/build-dmg.sh
      - name: Check the DMG
        run: scripts/test-dmg.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dmg
          path: dist/*.dmg*
          if-no-files-found: error
          retention-days: 14
