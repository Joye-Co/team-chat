name: CI

# What a pull request must pass, and nothing more. A check belongs here only when it tests our
# own code (not a third-party CLI, the operating system or the environment), cannot be covered by
# running the tests on a Mac, and fails with a clear verdict. The Windows installer and update
# are tested by the Release workflow, on the real build it ships. Real coding CLIs are tested
# locally with scripts/test-real-cli.sh.
#
# Each job runs only for the code it tests:
#   server/**                      -> Server
#   packages/**, protocol/**       -> Packages (protocol also every Rust job)
#   apps/daemon/**, update-helper  -> Rust tests (Linux), daemon on Windows, lint
#   apps/desktop/**, artifact-view -> Desktop on macOS, desktop on Windows, lint
#   crates/chat-protocol|core      -> all of the Rust jobs (everything builds on them)
#   ops/**, release scripts        -> Ops
#   CI implementation              -> every check, to exercise changes to the pipeline
#   release workflows              -> workflow lint and release script tests
#   docs/releases/**               -> desktop (embedded release notes) and Ops
#   other docs/**                  -> no build; CI result still reports success

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  # Group PR updates together. Each main push gets its own group: cancel-in-progress:false
  # alone still replaces an older pending run and serializes unrelated main builds.
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # No debug info: smaller objects, faster links, smaller caches.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # Manual runs, merge queue candidates and CI changes exercise every job.
      all: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group' || steps.filter.outputs.ci == 'true' }}
      packages: ${{ steps.filter.outputs.packages == 'true' }}
      server: ${{ steps.filter.outputs.server == 'true' }}
      ops: ${{ steps.filter.outputs.ops == 'true' }}
      workflows: ${{ steps.filter.outputs.workflows == 'true' }}
      # Everything Rust builds on these.
      core: ${{ steps.filter.outputs.core == 'true' }}
      daemon: ${{ steps.filter.outputs.daemon == 'true' }}
      desktop: ${{ steps.filter.outputs.desktop == 'true' }}
      artifact_view: ${{ steps.filter.outputs.artifact_view == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name != 'workflow_dispatch' && github.event_name != 'merge_group'
        with:
          filters: .github/ci-paths.yml

  workflows:
    name: Workflow lint
    needs: changes
    if: needs.changes.outputs.workflows == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: CI regression tests
        run: bun run test:ci
      - name: Install actionlint (verified archive)
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          mkdir -p .tmp/ci/bin
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -o .tmp/ci/actionlint.tar.gz
          echo "$ACTIONLINT_SHA256  .tmp/ci/actionlint.tar.gz" | sha256sum --check
          tar -xzf .tmp/ci/actionlint.tar.gz -C .tmp/ci/bin actionlint
      - name: actionlint
        run: .tmp/ci/bin/actionlint -color -shellcheck= -pyflakes=
      - name: CI shell scripts
        run: shellcheck -x scripts/ci-run.sh

  packages:
    name: Packages (bun)
    needs: changes
    if: needs.changes.outputs.packages == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Typecheck
        run: scripts/ci-run.sh typecheck packages/*
      - name: Test
        run: scripts/ci-run.sh test packages/*

  # The server's vitest files in three shards, side by side; the typecheck and the sandbox seed
  # (wrangler dev, every migration and the sample team of bun run dev:desktop) in the first.
  server:
    name: Server (Workers) ${{ matrix.shard }}/3
    needs: changes
    if: needs.changes.outputs.server == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Typecheck
        if: matrix.shard == 1
        run: scripts/ci-run.sh typecheck server
      - name: Test
        working-directory: server
        run: |
          mkdir -p ../.tmp/test-results
          bun run test --shard=${{ matrix.shard }}/3 --reporter=default --reporter=junit \
            --outputFile.junit=../.tmp/test-results/server-${{ matrix.shard }}.xml
      - name: Test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-tests-${{ matrix.shard }}
          path: .tmp/test-results/server-${{ matrix.shard }}.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Sandbox seed
        id: sandbox
        if: matrix.shard == 1
        run: bun scripts/sandbox/up.ts --reset
      - name: Stop the sandbox
        if: always() && steps.sandbox.outcome != 'skipped'
        run: bun scripts/sandbox/up.ts --stop
      - name: Sandbox server log
        if: failure() && matrix.shard == 1
        run: tail -n 200 .tmp/sandbox/server.log || true

  rust-lint:
    name: Rust fmt and clippy
    needs: changes
    if: >-
      needs.changes.outputs.core == 'true' || needs.changes.outputs.daemon == 'true' ||
      needs.changes.outputs.desktop == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        id: rust-cache
        with:
          shared-key: linux-clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        if: ${{ !cancelled() && steps.rust-cache.outcome == 'success' }}
        run: cargo clippy --locked -p chat-protocol -p chat-core -p daemon -p update-helper -p e2e --all-targets -- -D warnings

  rust:
    name: Rust tests (protocol, core, daemon)
    needs: changes
    if: >-
      needs.changes.outputs.core == 'true' || needs.changes.outputs.daemon == 'true' ||
      needs.changes.outputs.all == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux-test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo test
        run: cargo test --locked -p chat-protocol -p chat-core -p daemon -p update-helper

  desktop-macos:
    name: Desktop tests (macOS)
    needs: changes
    if: >-
      needs.changes.outputs.core == 'true' || needs.changes.outputs.desktop == 'true' ||
      needs.changes.outputs.all == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: macos
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo test
        run: cargo test --locked -p desktop
      # The isolation of an 产出 page in a real WKWebView (tests/isolation.rs): a security
      # property, run when its crate changes.
      - name: cargo test (artifact view)
        if: needs.changes.outputs.artifact_view == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.all == 'true'
        run: cargo test --locked -p artifact-view --no-fail-fast

  # Code under cfg(windows) cannot be built or tested on a Mac. The desktop app and the daemon
  # are separate jobs, so a daemon change does not build the app.
  windows-desktop:
    name: Desktop tests (Windows)
    needs: changes
    if: >-
      needs.changes.outputs.core == 'true' || needs.changes.outputs.desktop == 'true' ||
      needs.changes.outputs.all == 'true'
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows-desktop
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo test
        run: cargo test --locked -p desktop

  # The daemon's Windows code (Job Objects, ConPTY, access lists, the named pipe) and the update
  # helper's file replacement; the rest of the daemon runs on Linux.
  windows-daemon:
    name: Daemon tests (Windows)
    needs: changes
    if: >-
      needs.changes.outputs.core == 'true' || needs.changes.outputs.daemon == 'true' ||
      needs.changes.outputs.all == 'true'
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows-daemon
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo test
        run: |
          cargo test --locked -p daemon --features test-fakes --lib --bins --test process_tree
          cargo test --locked -p update-helper

  ops:
    name: Ops (monitor, restore)
    needs: changes
    if: needs.changes.outputs.ops == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Typecheck
        run: scripts/ci-run.sh typecheck ops/*
      - name: Test
        run: scripts/ci-run.sh test ops/*
      - name: Release script guards
        run: scripts/test-release-scripts.sh
      - name: Self-hosting setup (fake wrangler)
        run: scripts/test-setup-server.sh

  # Configure this one stable check in branch protection. Conditional skips are accepted only
  # for jobs the change detector did not select; a failed detector must never produce green CI.
  result:
    name: CI result
    needs: [changes, workflows, packages, server, rust-lint, rust, desktop-macos, windows-desktop, windows-daemon, ops]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check all required results
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci/check-results.mjs
