name: CI

# What a pull request must pass, and nothing more. A check belongs here only when it tests our
# own code (not a third-party CLI, the operating system or the environment), cannot be covered by
# running the tests on a Mac, and fails with a clear verdict. The Windows installer and update
# are tested by the Release workflow, on the real build it ships. Real coding CLIs are tested
# locally with scripts/test-real-cli.sh.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # A newer push replaces an older run of the same pull request; every run on main finishes,
  # so main's caches stay fresh.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # No debug info: smaller objects, faster links, smaller caches.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      packages: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.packages == 'true' }}
      server: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.server == 'true' }}
      rust: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.rust == 'true' }}
      desktop: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.desktop == 'true' }}
      windows: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.windows == 'true' }}
      artifact_view: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.artifact_view == 'true' }}
      ops: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.ops == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            common: &common
              - .github/workflows/ci.yml
              - scripts/ci-run.sh
              - scripts/lib.sh
            js: &js
              - *common
              - package.json
              - bun.lock
              - product.json
            cargo: &cargo
              - *common
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml
              - product.json
            packages:
              - *js
              - packages/**
              - protocol/**
              # gen-fixtures.ts copies the daemon's golden machine frames into protocol/fixtures.
              - apps/daemon/tests/fixtures/machine/**
            server:
              - *js
              - server/**
              - packages/**
              - scripts/sandbox/**
            rust:
              - *cargo
              - crates/chat-protocol/**
              - crates/chat-core/**
              - apps/daemon/**
              - apps/update-helper/**
              - tools/e2e/**
              - protocol/**
            desktop:
              - *cargo
              - crates/chat-protocol/**
              - crates/chat-core/**
              - crates/artifact-view/**
              - apps/desktop/**
              - assets/**
              - third_party/**
              - protocol/**
              - docs/PRODUCT.md
            # Everything Rust that the Windows build compiles: code under cfg(windows) cannot be
            # built or tested on a Mac.
            windows:
              - *cargo
              - crates/chat-protocol/**
              - crates/chat-core/**
              - crates/artifact-view/**
              - apps/desktop/**
              - apps/daemon/**
              - apps/update-helper/**
              - assets/**
              - third_party/**
              - protocol/**
            artifact_view:
              - *cargo
              - crates/artifact-view/**
            # ops/restore's config test reads server/wrangler.jsonc and ops/monitor/wrangler.jsonc.
            ops:
              - *js
              - ops/**
              - server/wrangler.jsonc
              - server/src/ops/index.ts
              - scripts/deploy-server.sh
              - scripts/release-check.sh
              - scripts/release.sh
              - scripts/build-daemon.sh
              - scripts/runner/install-daemon.sh
              - scripts/previous-windows-installer.sh
              - scripts/check-logs-for-servers.sh
              - scripts/test-release-scripts.sh
              - scripts/setup-server.sh
              - scripts/test-setup-server.sh
              - server/scripts/admin.ts
              - CHANGELOG.md
              - docs/releases/**

  packages:
    name: Packages (bun)
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: scripts/ci-run.sh typecheck packages/*
      - name: Test
        run: scripts/ci-run.sh test packages/*

  server:
    name: Server (Workers)
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: scripts/ci-run.sh typecheck server
      - name: Test
        run: scripts/ci-run.sh test server
      # The local sandbox (bun run dev:desktop): wrangler dev, every migration and the sample team
      # through the public API. A wire change that breaks the samples fails here.
      - name: Sandbox seed
        run: bun scripts/sandbox/up.ts --reset && bun scripts/sandbox/up.ts --stop
      - name: Sandbox server log
        if: failure()
        run: tail -n 200 .tmp/sandbox/server.log || true

  rust-lint:
    name: Rust fmt and clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        if: always()
        run: cargo clippy --locked -p chat-protocol -p chat-core -p daemon -p update-helper -p e2e --all-targets -- -D warnings

  rust:
    name: Rust tests (protocol, core, daemon)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo test
        run: cargo test --locked -p chat-protocol -p chat-core -p daemon -p update-helper

  desktop-macos:
    name: Desktop tests (macOS)
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: macos
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo test
        run: cargo test --locked -p desktop
      # The isolation of an 产出 page in a real WKWebView (tests/isolation.rs): a security
      # property, run when its crate changes.
      - name: cargo test (artifact view)
        if: needs.changes.outputs.artifact_view == 'true'
        run: cargo test --locked -p artifact-view --no-fail-fast

  windows:
    name: Windows build and tests
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo test (desktop)
        run: cargo test --locked -p desktop
      # The daemon's Windows code (Job Objects, ConPTY, access lists, the named pipe) and the
      # update helper's file replacement; the rest of the daemon runs on Linux.
      - name: cargo test (daemon and update helper)
        run: |
          cargo test --locked -p daemon --features test-fakes --lib --bins --test process_tree
          cargo test --locked -p update-helper

  ops:
    name: Ops (monitor, restore)
    needs: changes
    if: needs.changes.outputs.ops == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: scripts/ci-run.sh typecheck ops/*
      - name: Test
        run: scripts/ci-run.sh test ops/*
      - name: Release script guards
        run: scripts/test-release-scripts.sh
      - name: Self-hosting setup (fake wrangler)
        run: scripts/test-setup-server.sh
