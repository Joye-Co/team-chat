name: CI

# What a pull request must pass, and nothing more. A check belongs here only when it tests our
# own code (not a third-party CLI, the operating system or the environment), cannot be covered by
# running the tests on a Mac, and fails with a clear verdict. The Windows installer and update
# are tested by the Release workflow, on the real build it ships. Real coding CLIs are tested
# locally with scripts/test-real-cli.sh.
#
# PRs and main pushes run the affected packages/crates and their consumers only.
# A manual run is the full suite. Workflow edits run actionlint; docs-only edits do
# no builds, except executable SDK examples and release notes embedded in the app.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Cancel obsolete PR updates. Main runs use separate groups so they neither serialize
  # unrelated changes nor replace an older pending run.
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # No debug info: smaller objects, faster links, smaller caches.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # A manual run runs everything.
      all: ${{ github.event_name == 'workflow_dispatch' }}
      protocol: ${{ steps.filter.outputs.protocol == 'true' }}
      sdk: ${{ steps.filter.outputs.sdk == 'true' }}
      search: ${{ steps.filter.outputs.search == 'true' }}
      server: ${{ steps.filter.outputs.server == 'true' }}
      ops: ${{ steps.filter.outputs.ops == 'true' }}
      workflows: ${{ steps.filter.outputs.workflows == 'true' }}
      rust_protocol: ${{ steps.filter.outputs.rust_protocol == 'true' }}
      core: ${{ steps.filter.outputs.core == 'true' }}
      daemon: ${{ steps.filter.outputs.daemon == 'true' }}
      helper: ${{ steps.filter.outputs.helper == 'true' }}
      e2e: ${{ steps.filter.outputs.e2e == 'true' }}
      desktop: ${{ steps.filter.outputs.desktop == 'true' }}
      artifact_view: ${{ steps.filter.outputs.artifact_view == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            js: &js
              - .github/actions/setup-bun/**
              - package.json
              - bun.lock
              - scripts/ci-run.sh
              - scripts/lib.sh
            protocol_source: &protocol_source
              - *js
              - packages/protocol/src/**
              - packages/protocol/package.json
              - protocol/**
            protocol:
              - *protocol_source
              - packages/protocol/**
              # gen-fixtures.ts copies these golden machine frames.
              - apps/daemon/tests/fixtures/machine/**
            sdk:
              - *protocol_source
              - packages/bot-sdk/**
              - docs/bots.md
              - server/src/cards2/patch.ts
            search:
              - *js
              - packages/search/**
            server:
              - *protocol_source
              - product.json
              - server/**
              - packages/search/src/**
              - packages/search/package.json
              - scripts/sandbox/**
              - scripts/servers.ts
            ops:
              - *js
              - product.json
              - scripts/servers.ts
              - scripts/check-release-digest.sh
              - Cargo.toml
              - ops/**
              - server/wrangler.jsonc
              - server/src/ops/index.ts
              - server/scripts/admin.ts
              - scripts/deploy-server.sh
              - scripts/release-check.sh
              - scripts/release.sh
              - scripts/build-daemon.sh
              - scripts/runner/install-daemon.sh
              - scripts/previous-windows-installer.sh
              - scripts/check-logs-for-servers.sh
              - scripts/test-release-scripts.sh
              - scripts/setup-server.sh
              - scripts/test-setup-server.sh
              - CHANGELOG.md
              - docs/releases/**
            workflows:
              - .github/actions/**
              - .github/workflows/**
            rust_common: &rust_common
              - .cargo/**
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml
            rust_protocol: &rust_protocol
              - *rust_common
              - crates/chat-protocol/**
              - protocol/**
            core: &core
              - *rust_protocol
              - crates/chat-core/**
            daemon:
              - *rust_protocol
              - apps/daemon/**
            helper: &helper
              - *rust_common
              - apps/update-helper/**
            e2e:
              - *core
              - tools/e2e/**
            artifact_view: &artifact_view
              - *rust_common
              - crates/artifact-view/**
              - third_party/**
            desktop:
              - *core
              - *helper
              - *artifact_view
              - product.json
              - apps/desktop/**
              - assets/**
              - docs/releases/**

  workflows:
    name: Workflow lint
    needs: changes
    if: needs.changes.outputs.workflows == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color -shellcheck= -pyflakes=

  packages:
    name: Packages (bun)
    needs: changes
    if: >-
      needs.changes.outputs.protocol == 'true' || needs.changes.outputs.sdk == 'true' ||
      needs.changes.outputs.search == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-bun
      - name: Check affected packages
        env:
          ALL: ${{ needs.changes.outputs.all }}
          PROTOCOL: ${{ needs.changes.outputs.protocol }}
          SDK: ${{ needs.changes.outputs.sdk }}
          SEARCH: ${{ needs.changes.outputs.search }}
        run: |
          packages=()
          if [[ "$ALL" == true || "$PROTOCOL" == true ]]; then packages+=(packages/protocol); fi
          if [[ "$ALL" == true || "$SDK" == true ]]; then packages+=(packages/bot-sdk); fi
          if [[ "$ALL" == true || "$SEARCH" == true ]]; then packages+=(packages/search); fi
          scripts/ci-run.sh typecheck "${packages[@]}"
          scripts/ci-run.sh test "${packages[@]}"

  # The server's vitest files in three shards, side by side; the typecheck and the sandbox seed
  # (wrangler dev, every migration and the sample team of bun run dev:desktop) in the first.
  server:
    name: Server (Workers) ${{ matrix.shard }}/3
    needs: changes
    if: needs.changes.outputs.server == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-bun
      - name: Typecheck
        if: matrix.shard == 1
        run: scripts/ci-run.sh typecheck server
      - name: Test
        working-directory: server
        run: bun run test --shard=${{ matrix.shard }}/3
      - name: Sandbox seed
        id: sandbox
        if: matrix.shard == 1
        run: bun scripts/sandbox/up.ts --reset
      - name: Stop the sandbox
        if: always() && steps.sandbox.outcome != 'skipped'
        run: bun scripts/sandbox/up.ts --stop
      - name: Sandbox server log
        if: failure() && matrix.shard == 1
        run: tail -n 200 .tmp/sandbox/server.log || true

  rust-lint:
    name: Rust fmt and clippy
    needs: changes
    if: >-
      needs.changes.outputs.core == 'true' || needs.changes.outputs.daemon == 'true' ||
      needs.changes.outputs.helper == 'true' || needs.changes.outputs.e2e == 'true' ||
      needs.changes.outputs.desktop == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      # Desktop-only changes need workspace fmt, not a Linux daemon/core Clippy build.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        id: rust-cache
        if: >-
          needs.changes.outputs.core == 'true' || needs.changes.outputs.daemon == 'true' ||
          needs.changes.outputs.helper == 'true' || needs.changes.outputs.e2e == 'true' ||
          needs.changes.outputs.all == 'true'
        with:
          shared-key: linux-clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        if: ${{ !cancelled() && steps.rust-cache.outcome == 'success' }}
        env:
          ALL: ${{ needs.changes.outputs.all }}
          PROTOCOL: ${{ needs.changes.outputs.rust_protocol }}
          CORE: ${{ needs.changes.outputs.core }}
          DAEMON: ${{ needs.changes.outputs.daemon }}
          HELPER: ${{ needs.changes.outputs.helper }}
          E2E: ${{ needs.changes.outputs.e2e }}
        run: |
          crates=()
          if [[ "$ALL" == true || "$PROTOCOL" == true ]]; then crates+=(-p chat-protocol); fi
          if [[ "$ALL" == true || "$CORE" == true ]]; then crates+=(-p chat-core); fi
          if [[ "$ALL" == true || "$DAEMON" == true ]]; then crates+=(-p daemon); fi
          if [[ "$ALL" == true || "$HELPER" == true ]]; then crates+=(-p update-helper); fi
          if [[ "$ALL" == true || "$E2E" == true ]]; then crates+=(-p e2e); fi
          cargo clippy --locked "${crates[@]}" --all-targets -- -D warnings

  rust:
    name: Rust tests (protocol, core, daemon)
    needs: changes
    if: >-
      needs.changes.outputs.core == 'true' || needs.changes.outputs.daemon == 'true' ||
      needs.changes.outputs.helper == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux-test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo test
        env:
          ALL: ${{ needs.changes.outputs.all }}
          PROTOCOL: ${{ needs.changes.outputs.rust_protocol }}
          CORE: ${{ needs.changes.outputs.core }}
          DAEMON: ${{ needs.changes.outputs.daemon }}
          HELPER: ${{ needs.changes.outputs.helper }}
        run: |
          crates=()
          if [[ "$ALL" == true || "$PROTOCOL" == true ]]; then crates+=(-p chat-protocol); fi
          if [[ "$ALL" == true || "$CORE" == true ]]; then crates+=(-p chat-core); fi
          if [[ "$ALL" == true || "$DAEMON" == true ]]; then crates+=(-p daemon); fi
          if [[ "$ALL" == true || "$HELPER" == true ]]; then crates+=(-p update-helper); fi
          cargo test --locked "${crates[@]}"

  desktop-macos:
    name: Desktop tests (macOS)
    needs: changes
    if: >-
      needs.changes.outputs.desktop == 'true' ||
      needs.changes.outputs.all == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: macos
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo test
        run: cargo test --locked -p desktop
      # The isolation of an 产出 page in a real WKWebView (tests/isolation.rs): a security
      # property, run when its crate changes.
      - name: cargo test (artifact view)
        if: needs.changes.outputs.artifact_view == 'true' || needs.changes.outputs.all == 'true'
        run: cargo test --locked -p artifact-view --no-fail-fast

  # Code under cfg(windows) cannot be built or tested on a Mac. The desktop app and the daemon
  # are separate jobs, so a daemon change does not build the app.
  windows-desktop:
    name: Desktop tests (Windows)
    needs: changes
    if: >-
      needs.changes.outputs.desktop == 'true' ||
      needs.changes.outputs.all == 'true'
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows-desktop
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo test
        run: cargo test --locked -p desktop

  # The daemon's Windows code (Job Objects, ConPTY, access lists, the named pipe) and the update
  # helper's file replacement; the rest of the daemon runs on Linux.
  windows-daemon:
    name: Daemon tests (Windows)
    needs: changes
    if: >-
      needs.changes.outputs.daemon == 'true' || needs.changes.outputs.helper == 'true' ||
      needs.changes.outputs.all == 'true'
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows-daemon
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo test (daemon)
        if: needs.changes.outputs.daemon == 'true' || needs.changes.outputs.all == 'true'
        run: cargo test --locked -p daemon --features test-fakes --lib --bins --test process_tree
      - name: cargo test (update helper)
        if: needs.changes.outputs.helper == 'true' || needs.changes.outputs.all == 'true'
        run: cargo test --locked -p update-helper

  ops:
    name: Ops (monitor, restore)
    needs: changes
    if: needs.changes.outputs.ops == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-bun
      - name: Typecheck
        run: scripts/ci-run.sh typecheck ops/*
      - name: Test
        run: scripts/ci-run.sh test ops/*
      - name: Release script guards
        run: scripts/test-release-scripts.sh
      - name: Self-hosting setup (fake wrangler)
        run: scripts/test-setup-server.sh
