name: CI

# What a pull request must pass, and nothing more. A check belongs here only when it tests our
# own code (not a third-party CLI, the operating system or the environment), cannot be covered by
# running the tests on a Mac, and fails with a clear verdict. The Windows installer and update
# are tested by the Release workflow, on the real build it ships. Real coding CLIs are tested
# locally with scripts/test-real-cli.sh.
#
# Each job runs only for the code it tests:
#   server/**                      -> Server
#   packages/**, protocol/**       -> Packages (protocol also every Rust job)
#   apps/daemon/**, update-helper  -> Rust tests (Linux), daemon on Windows, lint
#   apps/desktop/**, artifact-view -> Desktop on macOS, desktop on Windows, lint
#   crates/chat-protocol|core      -> all of the Rust jobs (everything builds on them)
#   ops/**, release scripts        -> Ops
#   .github/workflows/**           -> actionlint only
#   docs/**                        -> nothing

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # A newer push replaces an older run of the same pull request; every run on main finishes,
  # so main's caches stay fresh.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # No debug info: smaller objects, faster links, smaller caches.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # A manual run runs everything.
      all: ${{ github.event_name == 'workflow_dispatch' }}
      packages: ${{ steps.filter.outputs.packages == 'true' }}
      server: ${{ steps.filter.outputs.server == 'true' }}
      ops: ${{ steps.filter.outputs.ops == 'true' }}
      workflows: ${{ steps.filter.outputs.workflows == 'true' }}
      # Everything Rust builds on these.
      core: ${{ steps.filter.outputs.core == 'true' }}
      daemon: ${{ steps.filter.outputs.daemon == 'true' }}
      desktop: ${{ steps.filter.outputs.desktop == 'true' }}
      artifact_view: ${{ steps.filter.outputs.artifact_view == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            js: &js
              - package.json
              - bun.lock
              - product.json
              - scripts/ci-run.sh
              - scripts/lib.sh
            packages:
              - *js
              - packages/**
              - protocol/**
              # gen-fixtures.ts copies the daemon's golden machine frames into protocol/fixtures.
              - apps/daemon/tests/fixtures/machine/**
            server:
              - *js
              - server/**
              - packages/**
              - scripts/sandbox/**
            ops:
              - *js
              - ops/**
              - server/wrangler.jsonc
              - server/src/ops/index.ts
              - server/scripts/admin.ts
              - scripts/deploy-server.sh
              - scripts/release-check.sh
              - scripts/release.sh
              - scripts/build-daemon.sh
              - scripts/runner/install-daemon.sh
              - scripts/previous-windows-installer.sh
              - scripts/check-logs-for-servers.sh
              - scripts/test-release-scripts.sh
              - scripts/setup-server.sh
              - scripts/test-setup-server.sh
              - CHANGELOG.md
              - docs/releases/**
            workflows:
              - .github/workflows/**
            core:
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml
              - crates/chat-protocol/**
              - crates/chat-core/**
              - protocol/**
            daemon:
              - apps/daemon/**
              - apps/update-helper/**
              - tools/e2e/**
            desktop:
              - product.json
              - apps/desktop/**
              - crates/artifact-view/**
              - assets/**
              - third_party/**
            artifact_view:
              - crates/artifact-view/**

  workflows:
    name: Workflow lint
    needs: changes
    if: needs.changes.outputs.workflows == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color -shellcheck= -pyflakes=

  packages:
    name: Packages (bun)
    needs: changes
    if: needs.changes.outputs.packages == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: scripts/ci-run.sh typecheck packages/*
      - name: Test
        run: scripts/ci-run.sh test packages/*

  # The server's vitest files in three shards, side by side; the typecheck and the sandbox seed
  # (wrangler dev, every migration and the sample team of bun run dev:desktop) in the first.
  server:
    name: Server (Workers) ${{ matrix.shard }}/3
    needs: changes
    if: needs.changes.outputs.server == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - name: Typecheck
        if: matrix.shard == 1
        run: scripts/ci-run.sh typecheck server
      - name: Test
        working-directory: server
        run: bun run test --shard=${{ matrix.shard }}/3
      - name: Sandbox seed
        if: matrix.shard == 1
        run: bun scripts/sandbox/up.ts --reset && bun scripts/sandbox/up.ts --stop
      - name: Sandbox server log
        if: failure() && matrix.shard == 1
        run: tail -n 200 .tmp/sandbox/server.log || true

  rust-lint:
    name: Rust fmt and clippy
    needs: changes
    if: >-
      needs.changes.outputs.core == 'true' || needs.changes.outputs.daemon == 'true' ||
      needs.changes.outputs.desktop == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        if: always()
        run: cargo clippy --locked -p chat-protocol -p chat-core -p daemon -p update-helper -p e2e --all-targets -- -D warnings

  rust:
    name: Rust tests (protocol, core, daemon)
    needs: changes
    if: >-
      needs.changes.outputs.core == 'true' || needs.changes.outputs.daemon == 'true' ||
      needs.changes.outputs.all == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo test
        run: cargo test --locked -p chat-protocol -p chat-core -p daemon -p update-helper

  desktop-macos:
    name: Desktop tests (macOS)
    needs: changes
    if: >-
      needs.changes.outputs.core == 'true' || needs.changes.outputs.desktop == 'true' ||
      needs.changes.outputs.all == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    env:
      # The crates under third_party/ (gpui and its components) are path dependencies: the
      # Rust cache does not keep them, sccache does.
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: macos
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - name: cargo test
        run: cargo test --locked -p desktop
      # The isolation of an 产出 page in a real WKWebView (tests/isolation.rs): a security
      # property, run when its crate changes.
      - name: cargo test (artifact view)
        if: needs.changes.outputs.artifact_view == 'true' || needs.changes.outputs.all == 'true'
        run: cargo test --locked -p artifact-view --no-fail-fast

  # Code under cfg(windows) cannot be built or tested on a Mac. The desktop app and the daemon
  # are separate jobs, so a daemon change does not build the app.
  windows-desktop:
    name: Desktop tests (Windows)
    needs: changes
    if: >-
      needs.changes.outputs.core == 'true' || needs.changes.outputs.desktop == 'true' ||
      needs.changes.outputs.all == 'true'
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      # The crates under third_party/ (gpui and its components) are path dependencies: the
      # Rust cache does not keep them, sccache does.
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows-desktop
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - name: cargo test
        run: cargo test --locked -p desktop

  # The daemon's Windows code (Job Objects, ConPTY, access lists, the named pipe) and the update
  # helper's file replacement; the rest of the daemon runs on Linux.
  windows-daemon:
    name: Daemon tests (Windows)
    needs: changes
    if: >-
      needs.changes.outputs.core == 'true' || needs.changes.outputs.daemon == 'true' ||
      needs.changes.outputs.all == 'true'
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows-daemon
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo test
        run: |
          cargo test --locked -p daemon --features test-fakes --lib --bins --test process_tree
          cargo test --locked -p update-helper

  ops:
    name: Ops (monitor, restore)
    needs: changes
    if: needs.changes.outputs.ops == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: scripts/ci-run.sh typecheck ops/*
      - name: Test
        run: scripts/ci-run.sh test ops/*
      - name: Release script guards
        run: scripts/test-release-scripts.sh
      - name: Self-hosting setup (fake wrangler)
        run: scripts/test-setup-server.sh
