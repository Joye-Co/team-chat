name: Release DMG

# Releases are normally made locally with scripts/release.sh. This workflow rebuilds the DMG
# on a macOS runner from a tag and attaches it to that tag's GitHub Release (it replaces a
# DMG of the same name). Use it when no Mac is at hand or a release lacks its DMG.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.2.0
        required: true
        type: string
      create:
        description: Create the release if the tag has none yet
        type: boolean
        default: false

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  dmg:
    name: Build and attach the DMG
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 45
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the tag name
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a release tag like v0.2.0"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
      - name: Check that Cargo.toml has the tag's version
        run: |
          . scripts/lib.sh
          version="$(workspace_version)"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Cargo.toml says $version but the tag is $TAG"
            exit 1
          fi
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: macos-release
      - name: Build the DMG
        run: scripts/build-dmg.sh
      - name: Check the DMG
        run: scripts/test-dmg.sh
      - name: Attach to the release
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            if [ "${{ inputs.create }}" = true ]; then
              prerelease=()
              if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
              gh release create "$TAG" --verify-tag --generate-notes "${prerelease[@]}"
            else
              echo "::error::No release for $TAG. Run scripts/release.sh, or rerun with 'create' set."
              exit 1
            fi
          fi
          gh release upload "$TAG" dist/*.dmg dist/*.dmg.sha256 --clobber
