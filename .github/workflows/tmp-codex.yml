name: tmp codex sandbox
on:
  push:
    branches: [claude/win-parity-machine-audit-2]
permissions:
  contents: read
jobs:
  t:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm install -g @openai/codex@0.167.1
      - shell: bash
        env:
          TC_REQUIRE_REAL_CODEX: "1"
          TC_CODEX_ELEVATED_SANDBOX: "1"
        run: |
          cargo test --locked -p daemon --features test-fakes --test runtimes -- codex_side_chat_network_on_windows || true
          cat target/tmp/codex-windows-network.json || true
