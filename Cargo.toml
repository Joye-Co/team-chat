[workspace]
resolver = "2"
members = [
    "crates/chat-protocol",
    "crates/chat-core",
    "apps/desktop",
    "apps/daemon",
    "tools/e2e",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
chat-protocol = { path = "crates/chat-protocol" }
chat-core = { path = "crates/chat-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
