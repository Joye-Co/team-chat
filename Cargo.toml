[workspace]
resolver = "2"
members = [
    "crates/chat-protocol",
    "crates/chat-core",
    "crates/artifact-view",
    "apps/desktop",
    "apps/daemon",
    "tools/e2e",
]

[workspace.package]
edition = "2024"
version = "1.2.2"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
chat-protocol = { path = "crates/chat-protocol" }
chat-core = { path = "crates/chat-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# gpui-pre with CJK line-break rules, measured truncation and a font-smoothing switch;
# gpui-pre-apple draws undilated glyphs without smoothing. See docs/ARCHITECTURE.md.
[patch.crates-io]
gpui-pre = { path = "third_party/gpui-pre" }
gpui-pre-apple = { path = "third_party/gpui-pre-apple" }
# gpui-component with a menu style the app sets (NATIVE.md §7.3: 24 pt rows, 13 pt text,
# radius 12, the glass edge and float shadow, the accent highlight). See src/menu/style.rs.
gpui-component = { path = "third_party/gpui-component" }
