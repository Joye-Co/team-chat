[package]
name = "artifact-view"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# The pinned SHA-256 of the bundled diagram library (src/diagram.rs).
sha2 = "0.10"

# The isolation checks run in a real web view on the main thread (no test harness).
[[test]]
name = "isolation"
harness = false

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-web-kit = "0.3"
block2 = "0.6"
dispatch2 = "0.3"

[target.'cfg(windows)'.dependencies]
# WebView2 COM bindings, used directly (not through wry): the isolation needs the custom
# scheme registration, the request filter for every URL, the settings and the permission,
# download and new-window events, which wry does not expose.
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"
