[package]
name = "chat-ffi"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
description = "UniFFI bridge from chat-core to Swift (and later Kotlin) for the mobile clients"

[lib]
name = "chat_ffi"
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[features]
cli = ["uniffi/cli"]

[dependencies]
chat-core.workspace = true
chat-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror = "2"
uniffi = "0.32"

[dev-dependencies]
# The bridge tests reuse chat-core's in-process mock server (crates/chat-core/tests/mock).
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tempfile = "3"
