<!doctype html>
<html lang="{{HTML_LANG}}">
<head>
<meta charset="utf-8">
<title>promo film</title>
<style>
/*@include app.css*/
*{box-sizing:border-box}
/* English: the system's own SF faces, by file (headless Chromium does not resolve -apple-system to them, and
   would set Latin in PingFang's glyphs); render.mjs allows file access for this */
@font-face{font-family:"Film SF";src:url("file:///System/Library/Fonts/SFNS.ttf");font-weight:1 1000}
@font-face{font-family:"Film SF Mono";src:url("file:///System/Library/Fonts/SFNSMono.ttf");font-weight:1 1000}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:#fff;transform-origin:0 0;font-family:-apple-system,"SF Pro Display","PingFang SC",system-ui,sans-serif;color:#0a0a0a;-webkit-font-smoothing:antialiased}
html[lang=en] #stage,html[lang=en] .app{font-family:"Film SF","PingFang SC",sans-serif}
html[lang=en] #live .tw .body{font-family:"Film SF Mono",monospace}
.ch-w{white-space:nowrap}
.fill{position:absolute;inset:0}
#ground2{background:#ececec}
#cam{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#appwrap{position:absolute;left:0;top:0;width:1440px;height:900px;transform-origin:720px 450px}
#winshadow{position:absolute;inset:0;border-radius:14px;box-shadow:0 0 0 .5px rgba(0,0,0,.22),0 36px 90px rgba(0,0,0,.22),0 8px 24px rgba(0,0,0,.08)}
.ch{display:inline-block;white-space:pre}
.app .row{margin-left:-8px;padding-left:8px}
/* film titles: the interface's own face, large, still once landed */
.ft{position:absolute;font-weight:600;letter-spacing:-.01em;line-height:1.22;white-space:nowrap}
#matte{position:absolute;left:0;right:0;bottom:0;height:350px;background:linear-gradient(rgba(255,255,255,0),#fff 42%)}
/* the cursor: big enough to follow */
#cursor{position:absolute;left:0;top:0;width:58px;height:58px;z-index:50;transform-origin:10px 6px;filter:drop-shadow(0 3px 5px rgba(0,0,0,.3))}

/* real screens of the product, in the window's own points */
.plate{position:absolute;left:0;top:0}
.plate>img{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.plate .cover{position:absolute}

/* the cards a member sends: real ones, as objects on the stage */
.cardimg{position:absolute;border-radius:26px;overflow:hidden;background:#fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.08),0 40px 100px rgba(0,0,0,.14),0 6px 18px rgba(0,0,0,.05)}
.cardimg img{display:block;width:100%;height:100%}
.cardimg .press{position:absolute}
#kinds{position:absolute;left:92px;top:956px;display:flex;gap:22px;font-size:30px;font-weight:500;color:#b9b9b9;white-space:nowrap}
#kinds span{display:inline-flex;align-items:center;gap:7px}
#kinds svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;opacity:0}
#kinds span.done{color:#737373}
#kinds span.done svg{opacity:1}
#kinds span.on{color:#0a0a0a}

/* ---- world: a screen recording of the group chat ---- */
.clip{background:#fff;overflow:hidden}
.clip .pane{position:absolute;left:0;top:0;width:470px;transform-origin:0 0}
.clip .bnw{position:absolute;left:0;right:0;top:13px;display:flex;justify-content:center}
.clip .banner{height:26px;padding:0 12px 0 9px;border-radius:13px;background:#f5f5f5;display:flex;align-items:center;gap:7px;font-size:12px;font-weight:500;white-space:nowrap}
.clip .rows{position:absolute;left:26px;top:56px;width:430px}
.clip .scrub{position:absolute;border-radius:3px;background:#e5e5e5}
.clip .scrub i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:#0a0a0a}

/* ---- world: the member's computer ---- */
#live{background:#e5e5e5}
#live .mb{position:absolute;left:0;right:0;top:0;height:60px;background:#efefef;display:flex;align-items:center;gap:40px;padding:0 44px;font-size:27px;color:#525252}
#live .mb b{color:#0a0a0a;font-weight:600}#live .mb .r{margin-left:auto}
#live .tw{position:absolute;left:96px;top:118px;width:1140px;height:650px;border-radius:22px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.08),0 30px 80px rgba(0,0,0,.16)}
#live .tw .bar{height:82px;border-bottom:1px solid #e5e5e5;display:flex;align-items:center;padding:0 32px;gap:14px;font-size:28px;color:#737373}
#live .tw .bar i{width:22px;height:22px;border-radius:50%}
#live .tw .bar>span{margin-left:28px}
#live .tw .body{padding:34px 44px;font:400 29px/54px "SF Mono",ui-monospace,Menlo,"PingFang SC",monospace;color:#0a0a0a;white-space:pre}
#live .tw .body .d{color:#737373}
#live .caret{display:inline-block;width:15px;height:32px;background:#737373;vertical-align:-5px}
#live .pc{position:absolute;left:1284px;top:118px;width:540px;height:650px;border-radius:22px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.08);padding:30px 34px;font-size:28px}
#live .pc .h{display:flex;align-items:baseline;gap:16px;font-weight:600;font-size:30px}
#live .pc .h span{font-weight:400;color:#737373;font-size:28px}
#live .pc .bar{height:6px;border-radius:3px;background:#e2e2e2;margin:26px 0 20px;overflow:hidden;position:relative}
#live .pc .bar i{position:absolute;inset:0;background:#0a0a0a;transform-origin:left}
#live .ps{height:84px;display:flex;align-items:center;gap:18px;color:#737373;border-radius:14px;padding:0 14px;margin:0 -14px;white-space:nowrap}
#live .ps .m{width:30px;height:30px;position:relative;flex:none}
#live .ps .m>*{position:absolute;inset:0}
#live .ps .m .o{border-radius:50%;box-shadow:inset 0 0 0 3px #d4d4d4}
#live .ps .m svg{width:30px;height:30px;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#live .ps .t{margin-left:auto;font-size:24px}
#live .mach{position:absolute;left:96px;top:816px;display:flex;align-items:center;gap:16px;font-size:28px;color:#525252}
#live .mach b{color:#0a0a0a;font-weight:600}
#live .mach .on{display:inline-flex;align-items:center;gap:10px;height:44px;padding:0 18px;border-radius:22px;background:#f5f5f5;font-size:24px;font-weight:500;color:#0a0a0a}
#live .mach .on i{width:14px;height:14px;border-radius:50%;background:#16a34a}

/* ---- a member, put together your way ---- */
#mk .face{position:absolute;left:250px;top:170px;width:400px;height:400px;transform-origin:50% 85%}
#mk .face>span{position:absolute;inset:0}
#mk .face img{position:absolute;inset:0;width:100%;height:100%;display:block}
#mk .face i{position:absolute;inset:12%;border-radius:28%;background:linear-gradient(#b4b4ba,#7b7b82)}
#mk .nm{position:absolute;left:150px;top:600px;width:600px;height:60px;font-size:46px;font-weight:600;text-align:center}
#mk .nm>span{position:absolute;left:0;right:0;top:0}
#mk .nm em{font-style:normal;color:#737373;font-weight:400;margin-left:16px}
#mk .rl{position:absolute;left:802px;font-size:27px;color:#737373;letter-spacing:.04em}
#mk .chips{position:absolute;left:800px;display:flex;gap:14px}
#mk .c2{position:relative;height:74px;padding:0 28px;border-radius:18px;background:#f5f5f5;font-size:34px;font-weight:500;color:#525252;display:flex;align-items:center;white-space:nowrap}
#mk .c2 u{position:absolute;inset:0;border-radius:18px;background:#0a0a0a;color:#fafafa;display:flex;align-items:center;justify-content:center;text-decoration:none}
html[lang=en] #mk .c2{padding:0 22px;font-size:32px}
#mk .os{position:absolute;left:800px;top:716px;height:62px;padding:0 26px;border-radius:31px;box-shadow:inset 0 0 0 2px #0a0a0a;font-size:30px;font-weight:600;display:flex;align-items:center;white-space:nowrap;transform-origin:left center}

/* ---- the end card ---- */
#end{background:#0a0a0a;color:#fafafa}
#end .claim{position:absolute;left:0;right:0;top:382px;text-align:center;font-size:136px;font-weight:600;letter-spacing:-.01em;line-height:1.22;white-space:nowrap}
#end .lock{position:absolute;left:0;top:318px;width:1920px;display:flex;justify-content:center;align-items:center;gap:44px}
#end .lock img{width:196px;height:196px;display:block}
#end .name{font-size:150px;font-weight:700;letter-spacing:-.035em;line-height:1}
#end .tag{position:absolute;left:0;right:0;top:566px;text-align:center;font-size:46px;font-weight:500;color:#e5e5e5;letter-spacing:.01em;white-space:nowrap}
#end .ctaw{position:absolute;left:0;right:0;top:706px;display:flex;justify-content:center}
#end .cta{height:92px;padding:0 54px;border-radius:46px;background:#fafafa;color:#0a0a0a;font-size:38px;font-weight:600;display:flex;align-items:center;gap:14px;white-space:nowrap}
#end .sub{position:absolute;left:0;right:0;top:838px;text-align:center;font-size:27px;color:#8f8f8f;letter-spacing:.02em}
</style>
</head>
<body>
<div id="stage">
  <div id="ground2" class="fill"></div>
  <div id="camwrap" class="fill"><div id="cam"><div id="appwrap"><div id="winshadow"></div><div id="apphost"></div></div></div></div>
  <div id="cards" class="fill"></div>
  <div id="mk" class="fill"></div>
  <div id="matte"></div>
  <div id="clipA" class="fill clip"></div>
  <div id="live" class="fill"></div>
  <div id="clipB" class="fill clip"></div>
  <div id="titles" class="fill"><div id="kinds"></div></div>
  <div id="end" class="fill"></div>
  <svg id="cursor" viewBox="0 0 24 24"><path d="M4 1.8 L4 19.8 L8.7 15.6 L11.8 22.4 L14.7 21.1 L11.7 14.5 L17.9 14.3 Z" fill="#0a0a0a" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg>
  <i id="px" style="position:absolute;right:0;bottom:0;width:1px;height:1px"></i>
</div>
<script>
const LANG = '{{LANG}}';      // zh or en, set by render.mjs --lang
/*@include copy.js*/
</script>
<script>
/*@include app.js*/
</script>
<script>
'use strict';
const PRODUCT = '{{PRODUCT_NAME}}';
const CHARS = /*CHARS*/{};          // character art, injected at render time from a private pack (never committed)

</script>
</body>
</html>
