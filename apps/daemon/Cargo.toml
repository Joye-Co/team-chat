[package]
name = "daemon"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "daemon"
path = "src/lib.rs"

[[bin]]
name = "daemon"
path = "src/main.rs"

[dependencies]
chat-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync", "fs", "net", "signal"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
flate2 = "1"
sha2 = "0.10"
toml = "0.9"
libc = "0.2"
regex = "1"
# Feature "accounts": API keys sealed to the machine's X25519 key (libsodium sealed boxes).
crypto_box = { version = "0.9.1", features = ["seal", "std"] }
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
roxmltree = "0.21"
libc = "0.2"
jsonschema = { version = "0.60.2", default-features = false }
