# The iPhone client's Xcode project, generated with XcodeGen (the .xcodeproj is not in the repo).
# apps/ios/build-sim.sh builds the Rust core, writes .tmp/ios/Product.xcconfig (product name,
# bundle id and version from product.json and Cargo.toml, paths of the built core) and runs
# `xcodegen` on this file.
name: Mobile
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: ../../.tmp/ios/Product.xcconfig
  Release: ../../.tmp/ios/Product.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: $(APP_VERSION)
    CURRENT_PROJECT_VERSION: 1
    TARGETED_DEVICE_FAMILY: 1
    CODE_SIGN_STYLE: Automatic
    # The app and its extensions share the Keychain item, the defaults and the cache through
    # this group.
    APP_GROUP: group.$(APP_BUNDLE_ID)
  configs:
    # APNs gateway of the push entitlement. Simulator builds are signed to run locally and do
    # not check it; a device build needs a profile with Push Notifications (docs: PR of M3).
    Debug:
      APS_ENVIRONMENT: development
    Release:
      APS_ENVIRONMENT: production

targets:
  Mobile:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - Sources
      - Shared
      - Extensions/Notify/AskCategory.swift
      - path: ../../.tmp/ios/gen/chat_ffi.swift
        group: Generated
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        # The generated bindings import the C module of the Rust core.
        OTHER_SWIFT_FLAGS: $(inherited) -Xcc -fmodule-map-file=$(CORE_GEN_DIR)/chat_ffiFFI.modulemap
        SWIFT_INCLUDE_PATHS: $(CORE_GEN_DIR)
        LIBRARY_SEARCH_PATHS: $(CORE_LIB_DIR)
        OTHER_LDFLAGS: $(inherited) -lchat_ffi
    dependencies:
      - sdk: SystemConfiguration.framework
      - sdk: Security.framework
      - target: Notify
      - target: Live
    info:
      path: Generated/Mobile-Info.plist
      properties:
        CFBundleDisplayName: $(PRODUCT_DISPLAY_NAME)
        CFBundleDevelopmentRegion: zh-Hans
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSSupportsLiveActivities: true
        AppGroup: $(APP_GROUP)
        AppBundleId: $(APP_BUNDLE_ID)
        # The operator's server (from the ops checkout at build time); empty asks at sign-in.
        DefaultServer: $(DEFAULT_SERVER)
        # 扫电脑上的码 (sign-in by QR code) and 打开时用面容解锁.
        NSCameraUsageDescription: 用来扫电脑上的二维码登录。
        NSFaceIDUsageDescription: 用面容确认是你本人。
    entitlements:
      path: Generated/Mobile.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]
        aps-environment: $(APS_ENVIRONMENT)

  # Notification service extension: reads the sign-in from the shared Keychain and app group,
  # hides pushes after sign-out and gives answerable questions their answer buttons.
  Notify:
    type: app-extension
    platform: iOS
    sources:
      - Extensions/Notify
      - Sources/Session.swift
      - path: ../../.tmp/ios/gen/chat_ffi.swift
        group: Generated
    dependencies:
      - sdk: SystemConfiguration.framework
      - sdk: Security.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).notify
        OTHER_SWIFT_FLAGS: $(inherited) -Xcc -fmodule-map-file=$(CORE_GEN_DIR)/chat_ffiFFI.modulemap
        SWIFT_INCLUDE_PATHS: $(CORE_GEN_DIR)
        LIBRARY_SEARCH_PATHS: $(CORE_LIB_DIR)
        OTHER_LDFLAGS: $(inherited) -lchat_ffi
    info:
      path: Generated/Notify-Info.plist
      properties:
        CFBundleDisplayName: $(PRODUCT_DISPLAY_NAME)
        AppGroup: $(APP_GROUP)
        AppBundleId: $(APP_BUNDLE_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: Generated/Notify.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]

  # Live Activity extension: a shell for now. Later it shows a run's progress on the lock screen.
  Live:
    type: app-extension
    platform: iOS
    sources:
      - Extensions/Live
      - Shared
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).live
    info:
      path: Generated/Live-Info.plist
      properties:
        CFBundleDisplayName: $(PRODUCT_DISPLAY_NAME)
        AppGroup: $(APP_GROUP)
        AppBundleId: $(APP_BUNDLE_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Generated/Live.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]
