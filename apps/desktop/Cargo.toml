[package]
name = "desktop"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.10" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10", features = ["runtime_shaders"] }
gpui-kit = "=0.8.1"
gpui-component = "=0.8.1"
# v12/kit: gpui-component's headless switch, checkbox and radio, styled at the
# native sizes (NATIVE.md §5.4) that gpui-component's fixed sizes do not have.
gpui-base = "=0.8.1"
futures = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde.workspace = true
serde_json.workspace = true
# The chat-core provider (src/provider/).
chat-core.workspace = true
tokio = { version = "1", features = ["sync", "time"] }
tracing = "0.1"
# Updater: checks the downloaded DMG again before it installs (src/updater/).
sha2 = "0.10"
# Thumbnails of image attachments (src/provider/files.rs).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# The 产出 window (src/views/artifacts/window.rs) and pages inside the window
# (src/ui/web_embed.rs). Its native parts build only on macOS.
artifact-view = { path = "../../crates/artifact-view" }
# Cuts a member name in the title bar at a grapheme boundary.
unicode-segmentation = "1.13"
# --- inc-refs: the Markdown block counter of 引用提问 (src/markdown/source.rs) parses with the
# same crate and options as gpui-component's renderer (already in the lock file).
markdown = "=1.0.0"
# --- end inc-refs

[dev-dependencies]
tempfile = "3"
gpui = { package = "gpui-pre", version = "=0.3.10", features = ["test-support"] }

[build-dependencies]
serde_json.workspace = true

# The screenshot self-test reads the NSWindow number (src/selftest/capture.rs);
# navigation uses AppKit for the about panel and the menu bar item.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
raw-window-handle = "0.6"
# Notifications, wake and network watching (src/provider/macos.rs).
block2 = "0.6"
libc = "0.2"
objc2-user-notifications = "0.3"
dispatch2 = "0.3"
# --- v11/media: 产出 media previews (src/views/media/native.rs): video frames and
# duration (AVFoundation), audio peaks and playback, PDF pages (PDFKit).
objc2-av-foundation = { version = "0.3", features = ["objc2-core-media"] }
objc2-core-media = "0.3"
objc2-pdf-kit = "0.3"
objc2-avf-audio = "0.3"
objc2-core-graphics = "0.3"
objc2-core-foundation = "0.3"
# --- end v11/media

# --- win/system: the Windows system integration (src/win32.rs, src/provider/windows.rs, the
# notification-area icon, 登录时启动, the settings window's height), and the screenshot
# self-test, which captures its own window (src/selftest/capture.rs). The windows crates at
# the versions GPUI already uses.
# Embedded 产出 pages are child windows of GPUI's HWND (src/ui/web_embed.rs).
[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
windows-registry = "0.6"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Storage_Xps",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# --- end win/system
