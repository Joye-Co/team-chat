[package]
name = "desktop"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.10" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10", features = ["runtime_shaders"] }
gpui-kit = "=0.8.1"
gpui-component = "=0.8.1"
futures = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde.workspace = true
serde_json.workspace = true
# The chat-core provider (src/provider/).
chat-core.workspace = true
tokio = { version = "1", features = ["sync", "time"] }
tracing = "0.1"
# Updater: checks the downloaded DMG again before it installs (src/updater/).
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
gpui = { package = "gpui-pre", version = "=0.3.10", features = ["test-support"] }

[build-dependencies]
serde_json.workspace = true

# The screenshot self-test reads the NSWindow number (src/selftest/capture.rs);
# navigation uses AppKit for the about panel and the menu bar item.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
raw-window-handle = "0.6"
# Notifications, wake and network watching (src/provider/macos.rs).
block2 = "0.6"
libc = "0.2"
objc2-user-notifications = "0.3"
