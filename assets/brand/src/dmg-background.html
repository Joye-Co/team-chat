<!doctype html>
<!-- DMG window background, 660 x 400 pt. Rendered at 1x and 2x by ../render.mjs.
     Finder draws the icon labels black over a background picture, in light and in dark mode
     (seen on macOS 26 in dark mode), so the window stays light in both.
     Icon centers (keep in sync with scripts/build-dmg.sh): app (180, 186), Applications (480, 186). -->
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; width: 660px; height: 400px; overflow: hidden; }
  body { background: #f5f5f7; font-family: -apple-system, "SF Pro Text", "PingFang SC", sans-serif; position: relative; }
  svg { position: absolute; inset: 0; }
  p { position: absolute; left: 0; right: 0; top: 330px; margin: 0; text-align: center;
      font-size: 13px; line-height: 18px; color: #6e6e73; }
</style></head><body>
<svg width="660" height="400" viewBox="0 0 660 400" xmlns="http://www.w3.org/2000/svg">
  <!-- The arrow from the app to Applications. -->
  <g fill="none" stroke="#8e8e93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 290 186 H 368"/>
    <path d="M 358 177 L 369 186 L 358 195"/>
  </g>
</svg>
<p>将图标拖到 Applications 文件夹即可安装</p>
</body></html>
